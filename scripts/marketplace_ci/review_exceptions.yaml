# Documented exceptions to the review rules (issue #573).
#
# What an entry does:
#   - A SCRIPT finding for `rule` on a path matching `path` is suppressed: it is kept in the result
#     with `suppressed: true` and this entry cited, and it never blocks.
#   - Every entry is rendered (rule, path, reason, authority; comments are not) into every MODEL
#     reviewer's briefing. A model finding is never suppressed by an entry: the reviewer is told the
#     exception exists, may not use it to excuse a security, permission or trust-boundary finding,
#     and reports a finding an entry seems to cover as minor with the entry cited.
#
# Fields: rule (stable id), path (glob, `**` crosses directories), reason (why the finding is
# wrong), authority (repo path of the document that states the exception).
#
# This file is Tier-1: git-tracked only, no local override. A PR that edits it is refused
# automated review and needs a maintainer bypass attestation, so a PR cannot suppress a finding
# about itself.

exceptions:
  - rule: r5-r6-ask-user-question-grant
    path: "plugins/**"
    reason: >-
      Listing AskUserQuestion in allowed-tools is a harmless no-op (the tool is always callable),
      and omitting it never fails R6's tool-used-but-not-granted check. Flag it as redundant at
      most, never as a missing grant or a violation.
    authority: plugins/plugin-devkit/skills/plugin-rulebook/references/frontmatter-corrections.md

  - rule: prompt-library-undeclared-grant
    path: "plugins/promptlibrary-kit/skills/prompt-library/SKILL.md"
    reason: >-
      Read, Write and WebFetch are deliberately absent from this skill's allowed-tools so that
      each real use raises its own permission prompt. Their absence is not a missing grant.
    authority: plugins/promptlibrary-kit/skills/prompt-library/SKILL.md

  - rule: mirror-byte-identity
    path: ".claude/**"
    reason: >-
      A file under .claude/ that is a byte-identical copy of its plugins/ source is generated by
      the mirror sync. Review the canonical file; do not ask for edits to the copy or report the
      same finding twice. This covers only such copies: a file with no plugins/ source (settings,
      hooks, rule sources) is reviewed normally, and a copy that differs from its source is mirror
      drift, reported by the parity job, not a model finding.
    authority: docs/ci.md

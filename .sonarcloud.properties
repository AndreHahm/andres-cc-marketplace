# SonarCloud Automatic Analysis settings.

# Paths left out of duplication detection (CPD) only; they are still analysed for issues.
# - Tests, fixtures and smoke tests repeat setup by nature.
# - git-review-ledger.py and git-verify-fix-diff.py carry a deliberately identical git guard block,
#   since each is run standalone by path; a shared module is tracked in issue 626.
# - .claude/, .codex/ and .agents/ hold generated mirrors of plugins/.
sonar.cpd.exclusions=\
  tests/**,\
  plugins/*/tests/**,\
  plugins/*/hooks/*/tests/**,\
  plugins/*/scripts/tests/**,\
  plugins/*/scripts/fixtures/**,\
  plugins/*/scripts/smoke-tests/**,\
  plugins/*/scripts/test*.*,\
  plugins/*/scripts/*test*.*,\
  plugins/*/skills/*/smoke*.*,\
  plugins/*/skills/*/scripts/smoke*.*,\
  plugins/git-kit/scripts/git-review-ledger.py,\
  plugins/git-kit/scripts/git-verify-fix-diff.py,\
  .claude/**,\
  .codex/**,\
  .agents/**

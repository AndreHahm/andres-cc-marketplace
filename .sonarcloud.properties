# SonarCloud Automatic Analysis settings.

sonar.python.version=3.13, 3.14

sonar.issue.ignore.multicriteria=p1,p2,p3,p4,p5,p6,p7

# insecure paths in python tools coming from command line input
sonar.issue.ignore.multicriteria.p1.ruleKey=pythonsecurity:S8701
sonar.issue.ignore.multicriteria.p1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p2.ruleKey=pythonsecurity:S8703
sonar.issue.ignore.multicriteria.p2.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p3.ruleKey=pythonsecurity:S8704
sonar.issue.ignore.multicriteria.p3.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p4.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.p4.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p5.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.p5.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p7.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.p7.resourceKey=**/*.py

# accept safely use publicly writeable directories (e.g. /tmp)
sonar.issue.ignore.multicriteria.p6.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.p6.resourceKey=**/*.py


# Paths left out of duplication detection (CPD) only; they are still analysed for issues.
# - Tests, fixtures and smoke tests repeat setup by nature.
# - git-review-ledger.py and git-verify-fix-diff.py carry a deliberately identical git guard block,
#   since each is run standalone by path; a shared module is tracked in issue 626.
# - .claude/, .codex/ and .agents/ hold generated mirrors of plugins/.
sonar.cpd.exclusions=\
  tests/**,\
  plugins/*/tests/**,\
  plugins/*/hooks/*/tests/**,\
  plugins/*/scripts/tests/**,\
  plugins/*/scripts/fixtures/**,\
  plugins/*/scripts/smoke-tests/**,\
  plugins/*/scripts/test*.*,\
  plugins/*/scripts/*test*.*,\
  plugins/*/skills/*/smoke*.*,\
  plugins/*/skills/*/scripts/smoke*.*,\
  plugins/git-kit/scripts/git-review-ledger.py,\
  plugins/git-kit/scripts/git-verify-fix-diff.py,\
  .claude/**,\
  .codex/**,\
  .agents/**

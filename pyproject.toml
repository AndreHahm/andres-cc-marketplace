[project]
name = "andres-cc-marketplace"
version = "0.1.0"
description = "Claude Code Marketplace with plugins created by Andre Hahm"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Andre Hahm" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "ty>=0.0.1a1",
  "PyYAML>=6.0",
  "pre-commit>=4.0",
  "mkdocs>=1.6.1",
  "mkdocs-awesome-pages-plugin>=2.10.1",
  "mkdocs-include-markdown-plugin>=7.2.0",
  "mkdocs-git-revision-date-localized-plugin>=1.4.7",
  "mkdocs-material>=9.6.22",
  "mkdocs-material-extensions>=1.3.1",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocstrings[python]>=0.30.1",
  "pymdown-extensions>=10.16.1",
  "markdown-it-py>=4.2,<5",
  "pytest-xdist>=3.8",
  "pytest-cov>=7.1.0",
]
# Only the test headless Claude review job installs these
# (.github/workflows/test-headless-claude-review-ci.yml). The two SDKs are pinned exactly, to releases
# at least two weeks old; PyYAML keeps the dev group's lower bound, and uv.lock pins every version.
headless-review = [
  "anthropic==2.3.0",
  "claude-agent-sdk==0.2.174",
  # claude_review's credential redaction imports review.py, which needs it.
  "PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
include = ["scripts/**/*.py", "tests/**/*.py", "plugins/session-kit/scripts/**/*.py", "plugins/session-kit/tests/**/*.py", "plugins/session-kit/skills/**/*.py", "plugins/workledger-kit/scripts/**/*.py", "plugins/quality-kit/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/marketplace_ci", "tests/reviewer_eval", "plugins/analysis-kit/tests", "plugins/session-kit/tests", "plugins/decision-kit/tests", "plugins/quality-kit/tests"]
# coverage.yml deselects these: tracing slows the measured code past the bound (4 failed on PR #746).
markers = ["timing: asserts a wall-clock bound on CPU work"]

# Read only when pytest runs with --cov (.github/workflows/coverage.yml). The sources are the code that
# pytest's testpaths exercise; the .claude/, .codex/ and .agents/ mirrors stay out. Data and reports go
# under .temp/coverage/, which .gitignore covers. patch = subprocess measures the scripts the tests start
# as subprocesses (91 % versus 89 % without it, 2026-11-15).
[tool.coverage.run]
source = ["scripts", "plugins/analysis-kit", "plugins/session-kit", "plugins/decision-kit", "plugins/quality-kit"]
omit = ["*/tests/*", "*/smoke_test.py"]
data_file = ".temp/coverage/.coverage"
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
# The plugin script directories have no __init__.py; without this, a script no test runs is left out of
# the total instead of counting as 0 %.
include_namespace_packages = true

[tool.ty.environment]
extra-paths = ["plugins/analysis-kit/scripts", "plugins/session-kit/scripts", "plugins/session-kit/skills/session-handoff/scripts", "plugins/session-kit/skills/session-recover/scripts", "plugins/workledger-kit/scripts"]

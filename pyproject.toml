[project]
name = "andres-cc-marketplace"
version = "0.1.0"
description = "Claude Code Marketplace with plugins created by Andre Hahm"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Andre Hahm" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "ty>=0.0.1a1",
  "PyYAML>=6.0",
  "pre-commit>=4.0"
]

[tool.ruff]
line-length = 100
target-version = "py313"
include = ["scripts/**/*.py", "tests/**/*.py", "plugins/session-kit/scripts/**/*.py", "plugins/session-kit/tests/**/*.py", "plugins/session-kit/skills/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/marketplace_ci", "plugins/analysis-kit/tests", "plugins/session-kit/tests"]

[tool.ty.environment]
extra-paths = ["plugins/analysis-kit/scripts", "plugins/session-kit/scripts", "plugins/session-kit/skills/session-handoff/scripts"]

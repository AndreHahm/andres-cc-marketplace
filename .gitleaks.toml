# This allowlist is limited to YAML/YML files to cut down SealedSecrets false positives.
# All gitleaks default rules still apply everywhere (useDefault = true).
# To broaden this allowlist to all files, comment out the 'paths' line below.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Pattern-only allowlist for long Ag… tokens in YAML
[[rules.allowlists]]
condition = "AND"
regexes = [
  # Boundary-safe Ag… token without lookarounds (RE2-safe)
  '''(?:^|[^A-Za-z0-9+/=])(Ag[A-Za-z0-9+/]{500,}={0,2})(?:[^A-Za-z0-9+/=]|$)'''
]
# Limit to YAML only for now. Comment this out if you want it to apply everywhere.
paths = ['''(?i).*\.ya?ml$''']

# One documentation file about secrets handling carries one deliberately fake Stripe-shaped
# example. Both conditions must hold: this exact path AND this exact fake value, so any other
# secret-shaped value added to that file (or this value anywhere else) is still reported.
[[allowlists]]
description = "Fake Stripe-shaped example in the secrets-handling guide (.agents copy)"
condition = "AND"
paths = ['''^\.agents/skills/skill-development/references/secrets-and-credentials\.md$''']
stopwords = ["sk_live_1234567890abcdef"]

# Workflow Orchestration Example (3 of 4) -> .github/workflows/deploy.yml
# Part of a 4-file set — see workflow-orchestration.yml for the full list and why these
# are separate files, not one multi-document YAML.
#
# This workflow deploys to staging/production AFTER CI completes successfully. Unlike
# security-scan.yml, it never checks out or executes PR source code — it only downloads
# the already-built artifact the (unprivileged) CI job produced, which is the safe
# pattern for a privileged workflow_run job that needs the PR's output but not its code.

name: Deploy Application

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5

    outputs:
      environment: ${{ steps.determine.outputs.environment }}
      should-deploy: ${{ steps.determine.outputs.should-deploy }}

    steps:
      - name: Determine environment
        id: determine
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "$HEAD_BRANCH" in
            main)
              ENV_NAME="production"
              SHOULD_DEPLOY="true"
              ;;
            staging)
              ENV_NAME="staging"
              SHOULD_DEPLOY="true"
              ;;
            *)
              ENV_NAME="none"
              SHOULD_DEPLOY="false"
              ;;
          esac

          echo "environment=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "should-deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "Deploying to: $ENV_NAME"

  deploy:
    name: Deploy to ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.should-deploy == 'true'
    timeout-minutes: 20

    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: https://${{ needs.determine-environment.outputs.environment }}.example.com

    steps:
      # Download artifacts from the CI workflow
      - name: Download build artifacts from CI
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: build-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -lah

      - name: Deploy to environment
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "Deploying to $ENVIRONMENT"
          echo "Commit SHA: $HEAD_SHA"
          echo "Branch: $HEAD_BRANCH"

          # Deployment commands here
          # Example: Upload to S3, deploy to Kubernetes, etc.

      - name: Run smoke tests
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
        run: |
          URL="https://$ENVIRONMENT.example.com"
          echo "Running smoke tests against $URL"

          # Basic health check
          curl -f "$URL/health" || exit 1

          echo "✅ Smoke tests passed"

      - name: Create deployment summary
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Deployment Complete

          **Environment:** $ENVIRONMENT
          **Commit:** $HEAD_SHA
          **Branch:** $HEAD_BRANCH
          **URL:** https://$ENVIRONMENT.example.com

          ### CI Workflow Details
          - **Workflow:** $WORKFLOW_NAME
          - **Run ID:** $WORKFLOW_RUN_ID
          - **Conclusion:** $WORKFLOW_CONCLUSION

          ✅ Deployment successful!
          EOF

# Workflow Orchestration Example (4 of 4) -> .github/workflows/performance-test.yml
# Part of a 4-file set — see workflow-orchestration.yml for the full list and why these
# are separate files, not one multi-document YAML.
#
# Run performance tests after CI completes (only on main branch). This job never checks
# out the triggering run's source — it operates solely on the build artifact CI already
# produced, so there is no `workflow_run` "pwn request" surface here (contrast
# security-scan.yml, which genuinely needs PR source for CodeQL and uses the
# `pull_request` trigger instead for that reason). The same-repository guard below is
# kept anyway as defense in depth around `contents: write`, not because this job
# executes untrusted PR code.

name: Performance Tests

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: write  # Required for repos.createCommitComment
  actions: read

jobs:
  performance-test:
    name: Run Performance Tests
    # Only run if CI passed, and only for same-repository PRs — defense in depth around
    # the contents:write permission, even though this job never checks out PR source.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download build artifacts from CI
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: build-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run performance benchmarks
        run: |
          echo "Running performance tests..."
          # Performance test commands here
          # Example: k6, lighthouse, etc.

      - name: Upload performance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-results
          path: performance-results/
          retention-days: 30

      - name: Comment with performance results
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            // The triggering run's head SHA is passed via env and read from process.env
            // rather than interpolated as ${{ }} into this script's source.
            const headSha = process.env.HEAD_SHA;

            const message = `## ⚡ Performance Test Results

            **Commit:** ${headSha}

            ✅ Performance tests completed

            [View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
              body: message
            });

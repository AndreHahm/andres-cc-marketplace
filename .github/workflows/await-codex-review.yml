name: Codex review status

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  await-codex-review:
    name: Await Codex review
    # Codex's own auto-review connector only re-triggers on: a PR opened
    # non-draft, a draft PR marked ready-for-review, or an explicit
    # "@codex review" PR comment -- not on every synchronize push (see
    # docs/await-codex-review.md). This job's own trigger scope mirrors
    # that so the 30-minute wait-loop only starts when Codex was actually
    # asked to look at this push.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@codex review'))
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_EVENT_TIME: ${{ github.event.pull_request.updated_at }}
      COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
    steps:
      - name: Wait for Codex review
        shell: bash
        run: |
          # issue_comment events carry no pull_request sub-object -- no head
          # SHA, no draft state. Resolve the PR's current state live instead.
          # A draft PR can still receive an "@codex review" comment; skip it
          # here rather than waiting, matching the pull_request-event job
          # condition's own draft skip above.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if ! pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"; then
              echo "::error::Could not resolve PR #${PR_NUMBER} state."
              exit 1
            fi
            if [ "$(jq -r '.state' <<< "$pr_json")" != "open" ]; then
              echo "PR #${PR_NUMBER} is not open; skipping."
              exit 0
            fi
            if [ "$(jq -r '.draft' <<< "$pr_json")" = "true" ]; then
              echo "PR #${PR_NUMBER} is a draft; skipping."
              exit 0
            fi
            HEAD_SHA="$(jq -r '.head.sha' <<< "$pr_json")"
            EVENT_TIME="$COMMENT_CREATED_AT"
          else
            HEAD_SHA="$PR_HEAD_SHA"
            EVENT_TIME="$PR_EVENT_TIME"
          fi

          echo "Waiting for Codex to review commit ${HEAD_SHA}..."

          # A clean (no-findings) Codex review has no review object and no
          # commit-scoped signal at all -- it only shows up as a "+1"
          # reaction on the PR issue, which carries no commit SHA at all (a
          # structural GitHub API limitation, not something a smarter
          # timestamp check can fully close). Anchoring to the triggering
          # event's own timestamp reduces, but cannot eliminate, the risk of
          # misattributing a slow, still-in-flight review of an earlier
          # commit to the current one -- see docs/await-codex-review.md's
          # Result Semantics section for the exact race this can't rule out.
          # Sleep at the top of each iteration (skipped on the first) so the
          # loop's very last action before giving up is always a check, not
          # a sleep -- otherwise a review/reaction arriving during the final
          # sleep is never observed, even though it lands within the
          # documented 30-minute window.
          for attempt in $(seq 1 61); do
            if [ "$attempt" -gt 1 ]; then
              sleep 30
            fi

            if ! reviews="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews"
            )"; then
              echo "Attempt ${attempt}/61: gh api request failed, retrying."
              continue
            fi

            if jq -s -e --arg sha "$HEAD_SHA" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .commit_id == $sha
              )
            ' <<< "$reviews" >/dev/null; then
              echo "Codex review received for ${HEAD_SHA}."
              exit 0
            fi

            if ! reactions="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/reactions"
            )"; then
              echo "Attempt ${attempt}/61: gh api request failed, retrying."
              continue
            fi

            if jq -s -e --arg event_time "$EVENT_TIME" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .content == "+1"
                and .created_at >= $event_time
              )
            ' <<< "$reactions" >/dev/null; then
              echo "Codex reacted with no findings at or after this push. This does not prove the reaction was for ${HEAD_SHA} specifically -- reactions carry no commit ID."
              exit 0
            fi

            echo "Attempt ${attempt}/61: review not received yet."
          done

          echo "::error::Codex did not submit a review within 30 minutes."
          exit 1

name: Codex review status

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  await-codex-review:
    name: Await Codex review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_TIME: ${{ github.event.pull_request.updated_at }}
    steps:
      - name: Wait for Codex review
        shell: bash
        run: |
          echo "Waiting for Codex to review commit ${HEAD_SHA}..."

          # A clean (no-findings) Codex review has no review object and no
          # commit-scoped signal at all -- it only shows up as a "+1"
          # reaction on the PR issue, which carries no commit SHA. Anchor
          # freshness to the triggering event's own timestamp (captured at
          # trigger time, before this job even starts) rather than a
          # snapshot taken once this job happens to run, so a reaction the
          # connector posts before this job starts still counts, and a
          # stale reaction from an earlier commit still doesn't.
          for attempt in $(seq 1 60); do
            if ! reviews="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews"
            )"; then
              echo "Attempt ${attempt}/60: gh api request failed, retrying."
              sleep 30
              continue
            fi

            if jq -s -e --arg sha "$HEAD_SHA" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .commit_id == $sha
              )
            ' <<< "$reviews" >/dev/null; then
              echo "Codex review received for ${HEAD_SHA}."
              exit 0
            fi

            if ! reactions="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/reactions"
            )"; then
              echo "Attempt ${attempt}/60: gh api request failed, retrying."
              sleep 30
              continue
            fi

            if jq -s -e --arg event_time "$EVENT_TIME" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .content == "+1"
                and .created_at >= $event_time
              )
            ' <<< "$reactions" >/dev/null; then
              echo "Codex reacted with no findings for ${HEAD_SHA}."
              exit 0
            fi

            echo "Attempt ${attempt}/60: review not received yet."
            sleep 30
          done

          echo "::error::Codex did not submit a review within 30 minutes."
          exit 1

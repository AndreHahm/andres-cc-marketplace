name: Codex review status

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  # Workflow-level concurrency is evaluated at run-creation time, before the job's own `if:`
  # below ever runs -- so without the second `${{ }}` segment here, *any* issue_comment (not
  # just an "@codex review" one) would enter this same group and cancel an in-progress
  # pull_request-triggered wait via cancel-in-progress, only to have its own job skipped by
  # the `if:` a moment later, leaving the check `cancelled` instead of pass/fail. Give a
  # comment the job's own `if:` will skip a unique, one-off group (keyed on this run's own
  # id) instead, so it can never collide with -- or cancel -- a real wait.
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '@codex review')) && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  await-codex-review:
    name: Await Codex review
    # Codex's own auto-review connector only re-triggers on: a PR opened
    # non-draft, a draft PR marked ready-for-review, or an explicit
    # "@codex review" PR comment -- not on every synchronize push (see
    # docs/await-codex-review.md). This job's own trigger scope mirrors
    # that so the 30-minute wait-loop only starts when Codex was actually
    # asked to look at this push.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@codex review'))
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_EVENT_TIME: ${{ github.event.pull_request.updated_at }}
      COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
    steps:
      - name: Wait for Codex review
        shell: bash
        run: |
          # issue_comment events carry no pull_request sub-object -- no head
          # SHA, no draft state. Resolve the PR's current state live instead.
          # A draft PR can still receive an "@codex review" comment; skip it
          # here rather than waiting, matching the pull_request-event job
          # condition's own draft skip above.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if ! pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"; then
              echo "::error::Could not resolve PR #${PR_NUMBER} state."
              exit 1
            fi
            if [ "$(jq -r '.state' <<< "$pr_json")" != "open" ]; then
              echo "PR #${PR_NUMBER} is not open; skipping."
              exit 0
            fi
            if [ "$(jq -r '.draft' <<< "$pr_json")" = "true" ]; then
              echo "PR #${PR_NUMBER} is a draft; skipping."
              exit 0
            fi
            HEAD_SHA="$(jq -r '.head.sha' <<< "$pr_json")"
            EVENT_TIME="$COMMENT_CREATED_AT"

            # An issue_comment run's own GITHUB_SHA/checkout is the default branch's latest
            # commit, not the PR's -- confirmed against GitHub's own docs. Left alone, this
            # job's own implicit status would attach a check-run to that wrong commit, which
            # would never appear in `gh pr checks` for this PR at all. Explicitly create and
            # later finalize a check-run against the PR's real head instead, via the Checks
            # API (needs the `checks: write` permission above).
            if ! CHECK_RUN_ID="$(
              gh api "repos/${REPOSITORY}/check-runs" \
                -f name="Await Codex review" \
                -f head_sha="$HEAD_SHA" \
                -f status=in_progress \
                --jq '.id'
            )"; then
              echo "::error::Could not create check-run against PR head ${HEAD_SHA}."
              exit 1
            fi
          else
            HEAD_SHA="$PR_HEAD_SHA"
            EVENT_TIME="$PR_EVENT_TIME"
          fi

          # No-op for the pull_request path (CHECK_RUN_ID unset there) -- that path's own
          # implicit job status already attaches to the correct commit, so nothing explicit
          # is needed. `|| true`: a failed PATCH here (e.g. a transient API error) shouldn't
          # mask this step's own real exit code, set immediately after each call below.
          # ALREADY_FINALIZED guards against the EXIT/INT/TERM trap below re-finalizing (and
          # overwriting) a conclusion this function already set via a normal exit.
          ALREADY_FINALIZED=false
          finalize_check_run() {
            if [ -n "${CHECK_RUN_ID:-}" ] && [ "$ALREADY_FINALIZED" != true ]; then
              ALREADY_FINALIZED=true
              # GitHub's "Update a check run" endpoint requires PATCH; gh api defaults to
              # POST whenever -f fields are present (its create-vs-update auto-detection is
              # based on parameter presence, not the endpoint), so this needs an explicit
              # --method override -- unlike the create call above, whose default POST already
              # matches what "Create a check run" expects.
              gh api --method PATCH "repos/${REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
                -f status=completed -f conclusion="$1" >/dev/null || true
            fi
          }
          # Best-effort: a check-run created via the Checks API (unlike a job's own implicit
          # status) is never auto-completed by GitHub if this job is cancelled -- e.g. a newer
          # trigger superseding it via cancel-in-progress, or the hard timeout-minutes cutoff --
          # so without this it would stay `in_progress` on the PR forever. Trap EXIT (a normal
          # exit already finalized via the calls below; this is then a no-op per the guard
          # above) and INT/TERM (GitHub's own cancellation signal) so a cancelled run still gets
          # a terminal conclusion where possible. Not a guarantee: it races GitHub's own short
          # cancellation grace period, and the PATCH call itself needs a network round-trip to
          # complete within it.
          trap 'finalize_check_run cancelled' EXIT INT TERM

          echo "Waiting for Codex to review commit ${HEAD_SHA}..."

          # A clean (no-findings) Codex review has no review object and no
          # commit-scoped signal at all -- it only shows up as a "+1"
          # reaction on the PR issue, which carries no commit SHA at all (a
          # structural GitHub API limitation, not something a smarter
          # timestamp check can fully close). Anchoring to the triggering
          # event's own timestamp reduces, but cannot eliminate, the risk of
          # misattributing a slow, still-in-flight review of an earlier
          # commit to the current one -- see docs/await-codex-review.md's
          # Result Semantics section for the exact race this can't rule out.
          # Sleep at the top of each iteration (skipped on the first) so the
          # loop's very last action before giving up is always a check, not
          # a sleep -- otherwise a review/reaction arriving during the final
          # sleep is never observed, even though it lands within the
          # documented 30-minute window.
          for attempt in $(seq 1 61); do
            if [ "$attempt" -gt 1 ]; then
              sleep 30
            fi

            if ! reviews="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews"
            )"; then
              echo "Attempt ${attempt}/61: gh api request failed, retrying."
              continue
            fi

            if jq -s -e --arg sha "$HEAD_SHA" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .commit_id == $sha
              )
            ' <<< "$reviews" >/dev/null; then
              echo "Codex review received for ${HEAD_SHA}."
              finalize_check_run success
              exit 0
            fi

            if ! reactions="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/reactions"
            )"; then
              echo "Attempt ${attempt}/61: gh api request failed, retrying."
              continue
            fi

            if jq -s -e --arg event_time "$EVENT_TIME" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .content == "+1"
                and .created_at >= $event_time
              )
            ' <<< "$reactions" >/dev/null; then
              echo "Codex reacted with no findings at or after this push. This does not prove the reaction was for ${HEAD_SHA} specifically -- reactions carry no commit ID."
              finalize_check_run success
              exit 0
            fi

            echo "Attempt ${attempt}/61: review not received yet."
          done

          echo "::error::Codex did not submit a review within 30 minutes."
          finalize_check_run failure
          exit 1

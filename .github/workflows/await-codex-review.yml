name: Codex review status

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  # Workflow-level concurrency is evaluated at run-creation time, before the job's own `if:`
  # below ever runs -- so without the second `${{ }}` segment here, *any* issue_comment (not
  # just an "@codex review" or "@codex full review" one) would enter this same group and
  # cancel an in-progress pull_request-triggered wait via cancel-in-progress, only to have
  # its own job skipped by the `if:` a moment later, leaving the check `cancelled` instead of
  # pass/fail. Give a comment the job's own `if:` will skip a unique, one-off group (keyed on
  # this run's own id) instead, so it can never collide with -- or cancel -- a real wait.
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ (github.event_name == 'issue_comment' && !(contains(github.event.comment.body, '@codex review') || contains(github.event.comment.body, '@codex full review'))) && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  await-codex-review:
    name: Await Codex review
    # Codex's own auto-review connector only re-triggers on: a PR opened
    # non-draft, a draft PR marked ready-for-review, or an explicit
    # "@codex review" or "@codex full review" PR comment -- not on every
    # synchronize push (see docs/await-codex-review.md). This job's own
    # trigger scope mirrors that so the 30-minute wait-loop only starts
    # when Codex was actually asked to look at this push.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && (contains(github.event.comment.body, '@codex review') || contains(github.event.comment.body, '@codex full review')))
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_EVENT_TIME: ${{ github.event.pull_request.updated_at }}
      COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
    steps:
      - name: Wait for Codex review
        shell: bash
        run: |
          # issue_comment events carry no pull_request sub-object -- no head
          # SHA, no draft state. Resolve the PR's current state live instead.
          # A draft PR can still receive an "@codex review" comment; skip it
          # here rather than waiting, matching the pull_request-event job
          # condition's own draft skip above.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if ! pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"; then
              echo "::error::Could not resolve PR #${PR_NUMBER} state."
              exit 1
            fi
            if [ "$(jq -r '.state' <<< "$pr_json")" != "open" ]; then
              echo "PR #${PR_NUMBER} is not open; skipping."
              exit 0
            fi
            if [ "$(jq -r '.draft' <<< "$pr_json")" = "true" ]; then
              echo "PR #${PR_NUMBER} is a draft; skipping."
              exit 0
            fi
            HEAD_SHA="$(jq -r '.head.sha' <<< "$pr_json")"
            EVENT_TIME="$COMMENT_CREATED_AT"

            # An issue_comment run's own GITHUB_SHA/checkout is the default branch's latest
            # commit, not the PR's -- confirmed against GitHub's own docs. Left alone, this
            # job's own implicit status would attach a check-run to that wrong commit, which
            # would never appear in `gh pr checks` for this PR at all. Explicitly create and
            # later finalize a check-run against the PR's real head instead, via the Checks
            # API (needs the `checks: write` permission above).
            if ! CHECK_RUN_ID="$(
              gh api "repos/${REPOSITORY}/check-runs" \
                -f name="Await Codex review" \
                -f head_sha="$HEAD_SHA" \
                -f status=in_progress \
                --jq '.id'
            )"; then
              echo "::error::Could not create check-run against PR head ${HEAD_SHA}."
              exit 1
            fi
          else
            HEAD_SHA="$PR_HEAD_SHA"
            EVENT_TIME="$PR_EVENT_TIME"
          fi

          # No-op for the pull_request path (CHECK_RUN_ID unset there) -- that path's own
          # implicit job status already attaches to the correct commit, so nothing explicit
          # is needed. ALREADY_FINALIZED is only set once the PATCH itself actually succeeds
          # (checked via the `if` below, not `|| true`) -- setting it unconditionally would
          # mask a transient PATCH failure on a genuine success/failure exit: the EXIT trap
          # would then see the guard already tripped and skip retrying, leaving the check-run
          # stuck `in_progress` despite the job having a real conclusion to report. On such a
          # failure this function returns without having finalized anything, and FINAL_CONCLUSION
          # (set every time, success or failure, before the guard is even checked) is what lets
          # the EXIT trap retry with the *correct* value rather than defaulting to `cancelled`.
          ALREADY_FINALIZED=false
          FINAL_CONCLUSION=""
          finalize_check_run() {
            if [ -n "${CHECK_RUN_ID:-}" ] && [ "$ALREADY_FINALIZED" != true ]; then
              FINAL_CONCLUSION="$1"
              # GitHub's "Update a check run" endpoint requires PATCH; gh api defaults to
              # POST whenever -f fields are present (its create-vs-update auto-detection is
              # based on parameter presence, not the endpoint), so this needs an explicit
              # --method override -- unlike the create call above, whose default POST already
              # matches what "Create a check run" expects.
              if gh api --method PATCH "repos/${REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
                -f status=completed -f conclusion="$FINAL_CONCLUSION" >/dev/null 2>&1; then
                ALREADY_FINALIZED=true
              fi
            fi
          }
          # Best-effort: a check-run created via the Checks API (unlike a job's own implicit
          # status) is never auto-completed by GitHub if this job is cancelled -- e.g. a newer
          # trigger superseding it via cancel-in-progress, or the hard timeout-minutes cutoff --
          # so without this it would stay `in_progress` on the PR forever. Trap EXIT (retries
          # with FINAL_CONCLUSION if a normal exit's own PATCH call above failed; a no-op per the
          # guard if it already succeeded) and INT/TERM (GitHub's own cancellation signal) so a
          # cancelled run still gets a terminal conclusion where possible. Falls back to
          # `cancelled` only when FINAL_CONCLUSION was never set at all -- i.e. the job was
          # killed before reaching any of its own normal exits, not after one merely failed to
          # PATCH. Still not a full guarantee: it races GitHub's own short cancellation grace
          # period, and each PATCH call needs a network round-trip to complete within it.
          trap 'finalize_check_run "${FINAL_CONCLUSION:-cancelled}"' EXIT INT TERM

          # Guard the resolved HEAD_SHA before it's ever sliced for signal 2's
          # $sha_prefix below -- an empty or malformed value would otherwise
          # fail *open*: an empty ${HEAD_SHA:0:7} makes jq's `contains("")`
          # vacuously true for every comment body, and the literal string
          # "null" (a `jq -r` miss on the issue_comment path) would match any
          # comment mentioning that word (security-reviewer finding m1).
          # Placed after the trap above (not before) so a malformed SHA still
          # finalizes the check-run instead of orphaning it `in_progress`.
          case "$HEAD_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *)
              echo "::error::Unexpected head SHA '${HEAD_SHA}' -- expected a hex commit SHA."
              finalize_check_run failure
              exit 1
              ;;
          esac

          echo "Waiting for Codex to review commit ${HEAD_SHA}..."

          # Three signals, checked in decreasing order of reliability. Only
          # the first (a formal submitted review) carries an exact commit
          # SHA. A re-triggered round (an "@codex review" comment, as
          # opposed to the PR's own first, automatic review) has been
          # observed to answer with a plain top-level PR comment instead of
          # a submitted review object at all -- so signal 1 alone is not
          # reliable for any round after the first. Signal 2 (a
          # "Reviewed commit: `<sha>`" comment, which Codex's connector
          # includes in every response we've observed, review or plain
          # comment alike) restores a commit-SHA correlation for that case.
          # Signal 3 (a bare "+1" reaction, Codex's response to a genuinely
          # clean review with nothing else to say) is the last resort: it
          # carries no commit SHA at all (a structural GitHub API
          # limitation, not something a smarter timestamp check can fully
          # close) -- found live, 2026-08-30: a "+1" reaction that
          # unambiguously satisfied this exact timestamp check (confirmed
          # after the fact, replayed verbatim against the same live data)
          # was never observed by 61 consecutive polls spanning the full
          # 30-minute window, pointing at a GitHub-side read-visibility gap
          # specific to this endpoint/call path rather than a logic bug --
          # signal 2 exists precisely so a genuine response doesn't depend
          # solely on that endpoint being reliably observable. Anchoring
          # every signal to the triggering event's own timestamp reduces,
          # but cannot eliminate, the risk of misattributing a slow,
          # still-in-flight review of an earlier commit to the current one
          # -- see docs/await-codex-review.md's Result Semantics section for
          # the exact race this can't rule out. Sleep at the top of each
          # iteration (skipped on the first) so the loop's very last action
          # before giving up is always a check, not a sleep -- otherwise a
          # review/comment/reaction arriving during the final sleep is never
          # observed, even though it lands within the documented 30-minute
          # window.
          for attempt in $(seq 1 61); do
            if [ "$attempt" -gt 1 ]; then
              sleep 30
            fi

            if ! reviews="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews"
            )"; then
              echo "Attempt ${attempt}/61: gh api request failed, retrying."
              continue
            fi

            if jq -s -e --arg sha "$HEAD_SHA" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .commit_id == $sha
              )
            ' <<< "$reviews" >/dev/null; then
              echo "Codex review received for ${HEAD_SHA}."
              finalize_check_run success
              exit 0
            fi

            if ! comments="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments"
            )"; then
              echo "Attempt ${attempt}/61: gh api request failed, retrying."
              continue
            fi

            # Require the SHA prefix to appear shortly after *some*
            # occurrence of the "Reviewed commit" label -- checking only the
            # *first* occurrence of each (via `index()`) can false-negative
            # on a comment that legitimately mentions the label text earlier
            # (in prose, or a quoted diff) before its real, adjacent
            # commit-footer pair later in the same body: the first-vs-first
            # distance can exceed the window even though a later label/SHA
            # pair is correctly adjacent (found live by Codex's own
            # automated PR review, on this exact PR, reviewing this exact
            # file -- which itself now contains the literal label text
            # multiple times in its own comments and docs, making this
            # false-negative shape a near-certainty for future rounds if
            # left as first-occurrence-only). `match(...; "g")` collects
            # every occurrence's offset instead; any qualifying pair passes.
            # No regex escaping needed either way -- "Reviewed commit" and
            # the hex `$sha_prefix` both contain no regex metacharacters.
            if jq -s -e --arg event_time "$EVENT_TIME" --arg sha_prefix "${HEAD_SHA:0:7}" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .created_at >= $event_time
                and ((.body | [match("Reviewed commit"; "g")] | map(.offset)) as $labels
                     | (.body | [match($sha_prefix; "g")] | map(.offset)) as $shas
                     | any($labels[]; . as $l | any($shas[]; . as $s | ($s - $l) >= 0 and ($s - $l) <= 20)))
              )
            ' <<< "$comments" >/dev/null; then
              echo "Codex commented reviewing ${HEAD_SHA} at or after this push."
              finalize_check_run success
              exit 0
            fi

            if ! reactions="$(
              gh api \
                --paginate \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/reactions"
            )"; then
              echo "Attempt ${attempt}/61: gh api request failed, retrying."
              continue
            fi

            if jq -s -e --arg event_time "$EVENT_TIME" '
              add | any(
                .[];
                .user.login == "chatgpt-codex-connector[bot]"
                and .content == "+1"
                and .created_at >= $event_time
              )
            ' <<< "$reactions" >/dev/null; then
              echo "Codex reacted with no findings at or after this push. This does not prove the reaction was for ${HEAD_SHA} specifically -- reactions carry no commit ID."
              finalize_check_run success
              exit 0
            fi

            echo "Attempt ${attempt}/61: review not received yet."
          done

          echo "::error::Codex did not submit a review within 30 minutes."
          finalize_check_run failure
          exit 1

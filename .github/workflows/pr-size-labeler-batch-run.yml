name: 'PR Size Labeler (Batch)'

on:
  workflow_dispatch:
    inputs:
      process_all:
        description: 'Process all PRs (open and closed) or open only'
        required: true
        default: 'false'
        type: 'choice'
        options:
          - 'true'
          - 'false'
      limit:
        description: 'Max number of PRs to fetch and check'
        required: true
        default: '100'
        type: 'string'
      dry_run:
        description: 'Dry run (log what would change without applying labels)'
        required: true
        default: 'false'
        type: 'choice'
        options:
          - 'true'
          - 'false'

permissions:
  pull-requests: 'write'

jobs:
  batch-label:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
            .github/WORKFLOW_KILLSWITCH
      - name: 'Check Workflow Kill Switch'
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: 'Track workflow rerun'
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: 'Batch label PRs'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
          # Passed through env, not interpolated directly into the script
          # below -- same reasoning already applied to DRY_RUN's siblings in
          # the batch-run workflows this file mirrors (pr-auto-label-batch-
          # run.yml, issue-auto-labeler-batch-run.yml): workflow_dispatch
          # inputs aren't validated against their declared `type: choice`
          # at the API level, so a value dispatched via `gh workflow run`/
          # the REST API could contain shell metacharacters. This file's
          # pre-existing PROCESS_ALL/LIMIT direct-interpolation lines below
          # are left as-is -- out of scope for this change.
          DRY_RUN: '${{ github.event.inputs.dry_run }}'
        run: |
          # Determine the state filter
          STATE="open"
          if [ "${{ github.event.inputs.process_all }}" = "true" ]; then
            STATE="all"
          fi

          LIMIT="${{ github.event.inputs.limit }}"

          # An API/CLI dispatch isn't validated against `type: choice`'s
          # declared options, so a malformed dry_run value (e.g. "True",
          # "1") must fail loudly here rather than silently reaching the
          # `= "true"` check below, where anything other than the exact
          # string "true" falls through toward the *mutating* `gh pr edit`
          # path -- the opposite of what a safety-preview feature should do
          # on bad input (Codex review finding, PR #331).
          if [ "$DRY_RUN" != "true" ] && [ "$DRY_RUN" != "false" ]; then
            echo "::error::dry_run must be exactly 'true' or 'false' -- got '$DRY_RUN'."
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 Dry run: no labels will actually be added or removed."
          fi
          echo "Batch labeling up to $LIMIT $STATE PRs..."

          # The 5 "size: *" labels are declared in .github/labels.yml (single
          # source of truth, synced to GitHub by sync-labels.yml) -- this step
          # only ever applies an already-existing label, it never creates one.

          # 1. Query PR list with all required fields in ONE call to prevent N+1 queries.
          # Check the command's own exit status separately from an empty
          # result -- a failed `gh pr list` (auth/rate-limit/API error) would
          # otherwise be indistinguishable from a legitimate "no PRs found"
          # and get silently treated as a no-op success (Codex + CodeRabbit
          # finding, PR #294 review).
          if ! PR_LIST=$(gh pr list --state "$STATE" --limit "$LIMIT" --json number,additions,deletions,labels); then
            echo "::error::gh pr list failed -- could not fetch the PR list."
            exit 1
          fi
          if [ -z "$PR_LIST" ] || [ "$PR_LIST" = "[]" ]; then
            echo "ℹ️ No PRs found matching the criteria."
            exit 0
          fi

          # Parse and iterate over PRs. Read from a process substitution, not a
          # pipe: `... | while read; do COUNT=$((COUNT+1)); done` runs the loop
          # body in a subshell in bash, so COUNT increments there are lost the
          # moment the pipeline ends -- the summary below would always print 0,
          # even though each PR's own per-iteration log line was correct.
          UPDATED_COUNT=0
          SKIPPED_COUNT=0
          FAILED_COUNT=0
          DRYRUN_COUNT=0

          while read -r PR_JSON; do
            PR_NUMBER=$(echo "$PR_JSON" | jq '.number')
            ADDITIONS=$(echo "$PR_JSON" | jq '.additions')
            DELETIONS=$(echo "$PR_JSON" | jq '.deletions')
            TOTAL=$((ADDITIONS + DELETIONS))

            # Calculate target size
            if [ $TOTAL -lt 10 ]; then
              SIZE="size: XS"
            elif [ $TOTAL -lt 50 ]; then
              SIZE="size: S"
            elif [ $TOTAL -lt 250 ]; then
              SIZE="size: M"
            elif [ $TOTAL -lt 1000 ]; then
              SIZE="size: L"
            else
              SIZE="size: XL"
            fi

            # Inspect existing labels to detect discrepancies
            EXISTING_LABELS=$(echo "$PR_JSON" | jq -r '.labels[].name' 2>/dev/null || echo "")

            LABELS_TO_REMOVE=()
            for L in "size: XS" "size: S" "size: M" "size: L" "size: XL"; do
              if echo "$EXISTING_LABELS" | grep -Fq "$L" && [ "$L" != "$SIZE" ]; then
                LABELS_TO_REMOVE+=("--remove-label" "$L")
              fi
            done

            LABEL_TO_ADD=()
            if ! echo "$EXISTING_LABELS" | grep -Fq "$SIZE"; then
              LABEL_TO_ADD+=("--add-label" "$SIZE")
            fi

            # Update labels if there's a difference
            if [ ${#LABELS_TO_REMOVE[@]} -gt 0 ] || [ ${#LABEL_TO_ADD[@]} -gt 0 ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "🔍 [dry-run] PR #$PR_NUMBER (+$ADDITIONS/-$DELETIONS = $TOTAL lines): would update size to $SIZE"
                DRYRUN_COUNT=$((DRYRUN_COUNT + 1))
              else
                echo "🔄 PR #$PR_NUMBER (+$ADDITIONS/-$DELETIONS = $TOTAL lines): updating size to $SIZE"
                # Only count as updated on actual success -- the previous
                # `2>/dev/null || true` discarded a real failure (rate limiting,
                # permissions, a missing label) and still counted it as updated,
                # so the batch could exit successfully while labels stayed
                # stale (Codex + CodeRabbit finding, PR #294 review).
                if gh pr edit "$PR_NUMBER" "${LABELS_TO_REMOVE[@]}" "${LABEL_TO_ADD[@]}"; then
                  UPDATED_COUNT=$((UPDATED_COUNT + 1))
                else
                  echo "::warning::Failed to update labels for PR #$PR_NUMBER"
                  FAILED_COUNT=$((FAILED_COUNT + 1))
                fi
              fi
            else
              echo "✅ PR #$PR_NUMBER (+$ADDITIONS/-$DELETIONS = $TOTAL lines): already has correct label ($SIZE). Skipping."
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
            fi
          done < <(echo "$PR_LIST" | jq -c '.[]')

          echo "============================================"
          echo "🎉 Batch run completed!"
          echo "Skipped (already correct): $SKIPPED_COUNT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Would update (dry-run): $DRYRUN_COUNT"
          else
            echo "Updated: $UPDATED_COUNT"
          fi
          echo "Failed: $FAILED_COUNT"
          if [ "$FAILED_COUNT" -gt 0 ]; then
            exit 1
          fi

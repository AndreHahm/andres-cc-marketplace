name: 'PR Size Labeler'

on:
  pull_request_target:
    types: ['opened', 'synchronize', 'reopened']
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to label manually (for workflow_dispatch)'
        required: false
        type: 'string'

concurrency:
  group: 'pr-size-labeler-${{ github.event.pull_request.number || github.event.inputs.pr_number }}'
  cancel-in-progress: true

permissions:
  pull-requests: 'write'
  issues: 'write'

jobs:
  size-label:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
            .github/actions/fork-safety
            .github/WORKFLOW_KILLSWITCH
      - name: 'Check Workflow Kill Switch'
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: 'Track workflow rerun'
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: 'Check if PR is from fork'
        id: 'fork-safety'
        uses: ./.github/actions/fork-safety

      - name: 'Run size labeler'
        if: steps.fork-safety.outputs.should-skip-writes != 'true'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
        run: |
          # Determine the target PR number
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            echo "❌ Error: No PR number provided."
            exit 1
          fi

          echo "Checking PR #$PR_NUMBER..."

          # The 5 "size: *" labels are declared in .github/labels.yml (single
          # source of truth, synced to GitHub by sync-labels.yml on every push
          # to main that touches that file) -- this step only ever applies an
          # already-existing label, it never creates one itself.

          # 1. Fetch PR details in a single efficient API call
          PR_DATA=$(gh pr view "$PR_NUMBER" --json additions,deletions,changedFiles,labels)
          if [ -z "$PR_DATA" ]; then
            echo "❌ Error: Could not fetch PR details."
            exit 1
          fi

          ADDITIONS=$(echo "$PR_DATA" | jq '.additions')
          DELETIONS=$(echo "$PR_DATA" | jq '.deletions')
          CHANGED_FILES=$(echo "$PR_DATA" | jq '.changedFiles')
          TOTAL=$((ADDITIONS + DELETIONS))

          echo "PR additions: $ADDITIONS, deletions: $DELETIONS, total changes: $TOTAL, files: $CHANGED_FILES"

          # 2. Calculate new size label
          if [ $TOTAL -lt 10 ]; then
            SIZE="size: XS"
          elif [ $TOTAL -lt 50 ]; then
            SIZE="size: S"
          elif [ $TOTAL -lt 250 ]; then
            SIZE="size: M"
          elif [ $TOTAL -lt 1000 ]; then
            SIZE="size: L"
          else
            SIZE="size: XL"
          fi

          # 3. Check existing labels and update only if necessary
          EXISTING_LABELS=$(echo "$PR_DATA" | jq -r '.labels[].name' 2>/dev/null || echo "")

          LABELS_TO_REMOVE=()
          for L in "size: XS" "size: S" "size: M" "size: L" "size: XL"; do
            if echo "$EXISTING_LABELS" | grep -Fq "$L" && [ "$L" != "$SIZE" ]; then
              LABELS_TO_REMOVE+=("--remove-label" "$L")
            fi
          done

          LABEL_TO_ADD=()
          if ! echo "$EXISTING_LABELS" | grep -Fq "$SIZE"; then
            LABEL_TO_ADD+=("--add-label" "$SIZE")
          fi

          # Perform a single, highly atomic edit call if changes are needed
          if [ ${#LABELS_TO_REMOVE[@]} -gt 0 ] || [ ${#LABEL_TO_ADD[@]} -gt 0 ]; then
            echo "Updating labels: removing ${LABELS_TO_REMOVE[*]}, adding $SIZE"
            gh pr edit "$PR_NUMBER" "${LABELS_TO_REMOVE[@]}" "${LABEL_TO_ADD[@]}"
          else
            echo "✅ PR #$PR_NUMBER already has the correct size label ($SIZE)."
          fi

          # 4. Premium, anti-spam comment logic (updates previous comment to keep thread clean)
          COMMENT="📊 PR Size: **$SIZE**
          - Lines changed: **$TOTAL**
          - Additions: +$ADDITIONS
          - Deletions: -$DELETIONS
          - Files changed: $CHANGED_FILES"

          # Find any existing size labeler comment by the github-actions bot.
          # --paginate: once a PR has enough comments for the existing size
          # marker to fall off the first page, an unpaginated lookup can't
          # find it and creates another marker on every sync (Codex finding,
          # PR #294 review). Captured into a variable first, THEN piped to
          # `head -n 1` as a separate step -- piping `gh api --paginate`
          # directly into `head` risks SIGPIPE aborting `gh` mid-fetch under
          # this shell's default `-o pipefail` (the same class of bug as the
          # `sort | head -1` case this repo's own review-learnings document).
          echo "Searching for existing size comment..."
          ALL_SIZE_COMMENT_IDS=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("📊 PR Size:"))) | .id')
          COMMENT_ID=$(printf '%s\n' "$ALL_SIZE_COMMENT_IDS" | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing comment (ID: $COMMENT_ID)..."
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -X PATCH -f body="$COMMENT" > /dev/null
          else
            echo "Creating new comment..."
            gh pr comment "$PR_NUMBER" --body "$COMMENT" > /dev/null
          fi

          echo "🎉 PR size labeling completed successfully."

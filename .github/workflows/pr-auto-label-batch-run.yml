# Batch runner for pr-auto-label.yml: applies the same file-based and
# conventional-commit title-based labeling to all open (and optionally
# closed) PRs in one manually-triggered run, mirroring the batch pattern
# from pr-size-labeler-batch-run.yml.
#
# Combines:
#   - .github/workflows/pr-auto-label.yml  (per-PR labeling logic)
#   - .github/workflows/pr-size-labeler-batch-run.yml (batch-run pattern)
#
# Differences from the per-PR pr-auto-label.yml:
#   - Triggered via workflow_dispatch (no pull_request_target event).
#   - No fork-safety check (workflow_dispatch is maintainer-triggered, not
#     by a fork PR -- same as pr-size-labeler-batch-run.yml).
#   - No "s: needs review" status label (only added on opened/reopened).
#   - No welcome comment (only posted on opened/reopened).
#   - actions/labeler is given an explicit pr-number list (newline-separated)
#     instead of relying on the pull_request_target event context.
#   - pr-auto-label.yml reads additions/deletions off the pull_request_target
#     event's own payload (context.payload.pull_request already carries
#     them). There's no event payload here, so each PR's full detail is
#     fetched individually via pulls.get in the title-labeling step below --
#     the REST "list pull requests" endpoint used to enumerate PRs does NOT
#     return additions/deletions (verified against this repo's own API
#     response), unlike `gh pr list --json additions,deletions`, which goes
#     through GraphQL and does. pr-size-labeler-batch-run.yml avoids this
#     gap by using `gh pr list` directly instead of the REST pulls.list
#     used here.
#   - Backfills a missing p: priority label (see the title-labeling step
#     below) -- pr-auto-label.yml has no equivalent of its own; PR priority
#     is currently only set interactively by the create-pr skill when
#     Claude opens the PR, not by any GitHub Actions workflow. This batch
#     run is the catch-up pass for PRs that predate that policy, were
#     opened by a human, or slipped through it. Reuses the same critical-
#     keyword regex and template-boilerplate stripping as
#     issue-auto-labeler-batch-run.yml's own priority-backfill step, kept
#     in sync deliberately (same scoring text, same skip/apply log lines)
#     even though the two live in different jobs/steps.
#
# Open items (disclosed, not blocking):
#   - Rate limiting: processing 100+ PRs in one run makes many API calls
#     (a pulls.get fetch per PR for real additions/deletions, plus
#     addLabels + removeLabel per PR for the title step, plus the labeler
#     action's own per-PR file fetch). For very large PR counts, consider
#     splitting into smaller batches via the limit input.
#   - Priority-tier detection is deliberately narrow: it only recognizes a
#     "critical" keyword pattern (mirroring issue-opened-labeler.yml's own,
#     the closest existing precedent since no PR-side automation defines
#     one), defaulting everything else to p: medium. p: high/p: low are
#     judgment calls per docs/github-label-taxonomy.md, not inferred here.

name: 'Auto-label PRs (Batch)'

on:
  workflow_dispatch:
    inputs:
      process_all:
        description: 'Process all PRs (open and closed) or open only'
        required: true
        default: 'false'
        type: 'choice'
        options:
          - 'true'
          - 'false'
      limit:
        description: 'Max number of PRs to fetch and check'
        required: true
        default: '100'
        type: 'string'

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  batch-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
            .github/WORKFLOW_KILLSWITCH

      - name: 'Check Workflow Kill Switch'
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: 'Track workflow rerun'
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      # ── List PRs ──────────────────────────────────────────────────────
      # Fetches PR numbers for actions/labeler's pr-number input. The
      # title-based step below fetches full PR data (title, additions,
      # deletions, labels) independently via the API -- two separate
      # fetches, but keeps each step self-contained.
      - name: 'List PRs'
        id: list-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          STATE="open"
          if [ "${{ github.event.inputs.process_all }}" = "true" ]; then
            STATE="all"
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          echo "Fetching up to $LIMIT $STATE PRs..."

          # Check the command's own exit status separately from an empty
          # result -- a failed gh pr list (auth/rate-limit/API error) would
          # otherwise be indistinguishable from "no PRs found" (same guard
          # as pr-size-labeler-batch-run.yml).
          if ! PR_LIST=$(gh pr list --state "$STATE" --limit "$LIMIT" --json number); then
            echo "::error::gh pr list failed -- could not fetch the PR list."
            exit 1
          fi

          PR_NUMBERS=$(echo "$PR_LIST" | jq -r '.[].number')
          PR_COUNT=$(echo "$PR_NUMBERS" | grep -c . || true)

          # Multiline output via EOF delimiter (GITHUB_OUTPUT convention).
          {
            echo "pr_numbers<<EOF"
            echo "$PR_NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No PRs found matching the criteria."
          else
            echo "Found $PR_COUNT PR(s) to process."
          fi

      # ── File-based labeling ───────────────────────────────────────────
      # Mirrors pr-auto-label.yml's "Label PRs by changed files" step,
      # but passes an explicit pr-number list since there is no
      # pull_request_target event context in a workflow_dispatch run.
      # actions/labeler@v6 reads .github/labeler.yml from the API when the
      # file isn't on the runner (sparse-checkout doesn't include it).
      - name: 'Label PRs by changed files'
        if: steps.list-prs.outputs.pr_count != '0'
        uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # ratchet:actions/labeler@v6.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          pr-number: ${{ steps.list-prs.outputs.pr_numbers }}

      # ── Title-based labeling + missing priority backfill ───────────────
      # Mirrors pr-auto-label.yml's "Label PR by Conventional Commit
      # title" step, adapted to iterate over all fetched PRs instead of
      # reading a single PR from the event payload. Runs after the
      # file-based labeler for the same reason as the per-PR workflow:
      # the labeler's sync-labels:true would strip back any overlapping
      # label this step just added if the ordering were reversed.
      #
      # Also backfills a missing p: priority label (see "Missing-priority
      # default" below) -- unlike the rest of this step, that part runs
      # for every PR regardless of whether the title has a Conventional
      # Commit prefix, since priority is independent of title format.
      - name: 'Label PRs by Conventional Commit title'
        if: steps.list-prs.outputs.pr_count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        env:
          PROCESS_ALL: ${{ github.event.inputs.process_all }}
          LIMIT: ${{ github.event.inputs.limit }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const state = process.env.PROCESS_ALL === 'true' ? 'all' : 'open';
            const limit = parseInt(process.env.LIMIT, 10) || 100;

            core.info(`Batch title-labeling up to ${limit} ${state} PRs...`);

            // Fetch PRs with all required fields. github.paginate handles
            // pagination; we slice to the requested limit afterwards.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state,
              per_page: 100,
            });
            const prsToProcess = prs.slice(0, limit);

            if (prsToProcess.length === 0) {
              core.info('No PRs found matching the criteria.');
              return;
            }

            // --- Label maps (kept in sync with pr-auto-label.yml) ---

            const IMPACT_MINOR = 'i: minor change';
            const IMPACT_MAJOR = 'i: major change';

            // Map CC types -> labels (Type)
            const map = {
              feat: 't: feature',
              fix: 't: bug',
              docs: 't: documentation',
              refactor: 't: refactor',
              perf: 't: performance',
              test: 't: test',
              build: 't: build',
              ci: 't: ci',
              chore: 't: chore',
              security: 't: security',
              style: 't: chore',
              revert: 't: chore',
            };

            // Map well-known scopes to area labels
            const scopeAreaMap = {
              api: 'a: api',
              frontend: 'a: frontend',
              backend: 'a: backend',
              db: 'a: database',
              database: 'a: database',
              docker: 'a: docker',
              devops: 'a: devops',
              ci: 'a: devops',
              tests: 'a: tests',
              test: 'a: tests',
              arch: 'a: architecture',
              architecture: 'a: architecture',
              observability: 'a: observability',
              'github-actions': 'a: github-actions',
              actions: 'a: github-actions',
              'ai-setup': 'a: ai-setup',
              'ai-evals': 'a: ai-evals',
              'ai-observability': 'a: ai-observability',
            };

            // Labels owned by .github/labeler.yml (file-based labeler) --
            // excluded from stale-label reconciliation so this step doesn't
            // remove a label the file-labeler just correctly applied (same
            // guard as pr-auto-label.yml, PR #290 round 3).
            const labelerOwned = new Set([
              't: documentation',
              't: ci',
              't: build',
              't: test',
              'a: ai-setup',
              'a: ai-evals',
              'a: github-actions',
              'a: tests',
              'a: architecture',
              'a: dependencies',
            ]);

            // Same boilerplate-stripping as issue-opened-labeler.yml and this
            // repo's own priority-detection step in issue-auto-labeler-
            // batch-run.yml, so an unfilled section of .github/pull_request_
            // template.md (its own HTML comments, unchecked "- [ ] ..." Type
            // of Change options, and "## ..." headers) isn't misread as PR
            // content when testing the critical-keyword pattern below.
            function stripTemplateBoilerplate(s) {
              return s
                .replace(/<!--[\s\S]*?-->/g, ' ')
                .replace(/^\s*-\s*\[\s\]\s.*$/gm, ' ')
                .replace(/^#{1,6}\s.*$/gm, ' ');
            }

            let updatedCount = 0;
            let skippedCount = 0;
            let failedCount = 0;

            for (const pr of prsToProcess) {
              try {
                const issue_number = pr.number;

                // github.rest.pulls.list (used to build prsToProcess above)
                // does NOT return additions/deletions -- verified against
                // this repo's own live API response. Only the single-PR
                // "Get a pull request" endpoint does; pr-size-labeler-batch-
                // run.yml avoids this gap entirely by using `gh pr list`
                // (GraphQL-backed) instead of this REST list endpoint. This
                // extra fetch also gives an up-to-date title/body/labels
                // snapshot, used below instead of the possibly-stale list
                // response.
                const { data: prDetail } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: issue_number,
                });

                const title = (prDetail.title || '').trim();
                const current = (prDetail.labels || [])
                  .map((l) => (typeof l === 'string' ? l : l.name))
                  .filter(Boolean);

                const labelsToAdd = new Set();

                // Missing-priority default -- runs for every PR regardless
                // of Conventional Commit title format. docs/github-label-
                // taxonomy.md's Priority section states every PR gets
                // exactly one p: label, defaulting to p: medium when
                // nothing signals otherwise. Only fills the gap when no p:
                // label exists yet -- never overrides an already-set tier,
                // since that's a human/agent judgment call this batch pass
                // shouldn't second-guess.
                if (!current.some((l) => l.startsWith('p: '))) {
                  const text = stripTemplateBoilerplate(`${prDetail.title || ''}\n${prDetail.body || ''}`);
                  const isCritical = /\b(critical|urgent|blockers?|blocking|asap|production down)\b/i.test(text);
                  const priorityLabel = isCritical ? 'p: critical' : 'p: medium';
                  core.info(`PR #${issue_number}: no priority label found -- applying "${priorityLabel}".`);
                  labelsToAdd.add(priorityLabel);
                } else {
                  core.info(`PR #${issue_number}: already has a priority label. Skipping default.`);
                }

                // Conventional Commit header: type(scope)!: subject
                const m = title.match(/^([a-zA-Z]+)(\(([^)]+)\))?(!)?:\s+/);

                let toRemove = [];

                if (!m) {
                  core.info(`PR #${issue_number}: no conventional-commit prefix in title "${title}" -- skipping CC-derived labels.`);
                } else {
                  const type = (m[1] || '').toLowerCase();
                  const scopeRaw = (m[3] || '').toLowerCase();
                  const isBreaking = !!m[4];

                  // Size-derived impact label (same computation as pr-auto-label.yml)
                  const totalChanges = (prDetail.additions || 0) + (prDetail.deletions || 0);
                  const sizeImpact = totalChanges < 50 ? IMPACT_MINOR : IMPACT_MAJOR;

                  // Type label
                  if (map[type]) labelsToAdd.add(map[type]);

                  // Impact label: breaking always wins; "i: breaking change"
                  // is deliberately left out of managedUniverse below (same as
                  // pr-auto-label.yml -- pr-impact-autofix.yml owns its removal).
                  if (isBreaking) {
                    labelsToAdd.add('i: breaking change');
                  } else {
                    labelsToAdd.add(sizeImpact);
                  }

                  // Area label from CC scope
                  if (scopeRaw) {
                    const depScopes = ['deps', 'deps-dev', 'dependencies', 'dependabot', 'renovate'];
                    const isDeps = depScopes.includes(scopeRaw) || scopeRaw.startsWith('deps');
                    if (isDeps) labelsToAdd.add('a: dependencies');
                    if (scopeAreaMap[scopeRaw]) labelsToAdd.add(scopeAreaMap[scopeRaw]);
                  }

                  // Reconcile stale type/scope/size-impact labels from a
                  // previous title or diff size. Only remove a label within
                  // this step's managed universe and not in the newly-computed
                  // set (same logic as pr-auto-label.yml). p: labels are never
                  // in managedUniverse, so the priority default above is never
                  // touched by this reconciliation either way.
                  const managedUniverse = new Set(
                    [...Object.values(map), ...Object.values(scopeAreaMap), 'a: dependencies',
                     IMPACT_MINOR, IMPACT_MAJOR]
                      .filter((label) => !labelerOwned.has(label))
                  );
                  toRemove = current.filter((l) => managedUniverse.has(l) && !labelsToAdd.has(l));
                }

                const labels = Array.from(labelsToAdd);
                let changed = false;

                if (labels.length > 0) {
                  core.info(`PR #${issue_number}: adding labels: ${labels.join(', ')}`);
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number,
                    labels,
                  });
                  changed = true;
                }

                for (const label of toRemove) {
                  core.info(`PR #${issue_number}: removing stale label: ${label}`);
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number,
                      name: label,
                    });
                    changed = true;
                  } catch (e) {
                    core.warning(`PR #${issue_number}: could not remove stale label "${label}": ${e.message}`);
                  }
                }

                if (changed) {
                  updatedCount++;
                } else {
                  core.info(`PR #${issue_number}: already has correct labels. Skipping.`);
                  skippedCount++;
                }
              } catch (e) {
                core.warning(`PR #${pr.number}: failed to process -- ${e.message}`);
                failedCount++;
              }
            }

            core.info('============================================');
            core.info('Batch auto-label run completed!');
            core.info(`Skipped (nothing to add or remove): ${skippedCount}`);
            core.info(`Updated: ${updatedCount}`);
            core.info(`Failed: ${failedCount}`);
            if (failedCount > 0) {
              core.setFailed(`${failedCount} PR(s) failed to process.`);
            }

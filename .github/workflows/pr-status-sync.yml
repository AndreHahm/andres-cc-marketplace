# ─────────────────────────────────────────────────────────────────
# PR Status Comment Workflow
# ─────────────────────────────────────────────────────────────────
# Posts a lifecycle-transition comment on any issue linked from a PR's
# description (Closes/Fixes/Resolves/Relates to #N). This does NOT update
# any issue/project status field or Projects board -- there is no
# project-sync backend configured in this repo. It's a notification only;
# an actual reader still has to change the issue's own status/label by hand.
#
# Comment posted on:
# - PR opened (ready) -> "PR ready for review" comment
# - PR draft -> "PR converted to draft" comment
# - PR merged -> "PR merged" comment + delete branch
# - PR closed (not merged) -> "PR closed" comment
#
# Features:
# - Extracts linked issues from PR body
# - Deletes merged branches
# - Fork-safe (skip writes for forks)
# - Debounced (10s delay to prevent loops)
# ─────────────────────────────────────────────────────────────────

name: PR Status Comment

on:
  pull_request:
    types:
      - opened
      - closed
      - converted_to_draft
      - ready_for_review
      - reopened
    branches:
      - main

  pull_request_review:
    types:
      - submitted
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

# Concurrency control (debounce)
concurrency:
  group: pr-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Fork Safety Check
  # ─────────────────────────────────────────────────────────────────
  fork-check:
    name: Check Fork Status
    runs-on: ubuntu-latest
    outputs:
      is-fork: ${{ steps.fork-safety.outputs.is-fork }}
      should-skip-writes: ${{ steps.fork-safety.outputs.should-skip-writes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Check if PR is from fork
        id: fork-safety
        uses: ./.github/actions/fork-safety

  # ─────────────────────────────────────────────────────────────────
  # Extract Linked Issues
  # ─────────────────────────────────────────────────────────────────
  extract-issues:
    name: Extract Linked Issues
    runs-on: ubuntu-latest
    outputs:
      issue-numbers: ${{ steps.extract.outputs.issue-numbers }}
      has-issues: ${{ steps.extract.outputs.has-issues }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Extract linked issues from PR body
        id: extract
        run: |
          PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")

          echo "🔍 Extracting linked issues from PR #$PR_NUMBER"

          # Regex to find: Closes #123, Fixes #456, Resolves #789, Relates to #101
          NUMBERS=$(printf '%s' "$PR_BODY" \
            | tr '\n' ' ' \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|relates?[[:space:]]+to)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' \
            | sort -nu \
            | paste -sd, - \
            || true)

          if [[ -z "$NUMBERS" ]]; then
            echo "⚠️  No linked issues found in PR description"
            echo "has-issues=false" >> "$GITHUB_OUTPUT"
            echo "issue-numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_COUNT=$(printf '%s\n' "$NUMBERS" | tr ',' '\n' | wc -l)
          ISSUE_LIST=$(printf '%s' "$NUMBERS" | sed 's/,/, #/g')
          echo "✅ Found $ISSUE_COUNT linked issue(s): #$ISSUE_LIST"

          echo "has-issues=true" >> "$GITHUB_OUTPUT"
          echo "issue-numbers=$NUMBERS" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # Debounce Delay (Prevent Loops)
  # ─────────────────────────────────────────────────────────────────
  debounce:
    name: Debounce Delay
    runs-on: ubuntu-latest
    needs:
      - fork-check
      - extract-issues
    if: |
      needs.fork-check.result == 'success' &&
      needs.fork-check.outputs.should-skip-writes == 'false' &&
      needs.extract-issues.outputs.has-issues == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Wait 10 seconds to prevent loops
        run: |
          echo "⏱️  Waiting 10 seconds to debounce automation loops..."
          sleep 10
          echo "✅ Debounce complete"

  # ─────────────────────────────────────────────────────────────────
  # Comment on Linked Issues Based on PR Event
  # ─────────────────────────────────────────────────────────────────
  sync-issue-status:
    name: Comment on Linked Issues
    runs-on: ubuntu-latest
    needs:
      - fork-check
      - extract-issues
      - debounce
    if: |
      needs.fork-check.result == 'success' &&
      needs.fork-check.outputs.should-skip-writes == 'false' &&
      needs.extract-issues.outputs.has-issues == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Determine comment to post
        id: determine-status
        run: |
          PR_STATE="${{ github.event.pull_request.state }}"
          PR_DRAFT="${{ github.event.pull_request.draft }}"
          PR_MERGED="${{ github.event.pull_request.merged }}"
          EVENT_ACTION="${{ github.event.action }}"

          echo "📊 PR Details:"
          echo "   State: $PR_STATE"
          echo "   Draft: $PR_DRAFT"
          echo "   Merged: $PR_MERGED"
          echo "   Action: $EVENT_ACTION"

          # TARGET_STATUS selects which comment template to post below --
          # this workflow only ever comments on linked issues, it never
          # changes any real issue/project status field (no project-sync
          # backend is configured in this repo).
          TARGET_STATUS=""

          if [[ "$PR_MERGED" == "true" ]]; then
            TARGET_STATUS="To Deploy"
            echo "✅ PR merged → will comment 'ready for deployment' on linked issues"

          elif [[ "$PR_STATE" == "closed" && "$PR_MERGED" != "true" ]]; then
            TARGET_STATUS="In Progress"
            echo "🔄 PR closed without merge → will comment on linked issues"

          elif [[ "$PR_DRAFT" == "true" || "$EVENT_ACTION" == "converted_to_draft" ]]; then
            TARGET_STATUS="In Progress"
            echo "📝 PR is draft → will comment on linked issues"

          elif [[ "$PR_STATE" == "open" && "$PR_DRAFT" == "false" ]]; then
            TARGET_STATUS="In Review"
            echo "👀 PR ready for review → will comment on linked issues"

          else
            echo "⚠️  Unknown PR state - skipping comment"
            exit 0
          fi

          echo "target-status=$TARGET_STATUS" >> $GITHUB_OUTPUT

      - name: Comment on linked issues
        if: steps.determine-status.outputs.target-status != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_STATUS: ${{ steps.determine-status.outputs.target-status }}
          ISSUE_NUMBERS: ${{ needs.extract-issues.outputs.issue-numbers }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumbers = (process.env.ISSUE_NUMBERS || '').split(',').filter(n => n.trim());
            const targetStatus = process.env.TARGET_STATUS;

            console.log(`🔄 Commenting on ${issueNumbers.length} linked issue(s) (transition: ${targetStatus})`);

            for (const issueNumber of issueNumbers) {
              try {
                console.log(`\n📌 Commenting on issue #${issueNumber}...`);

                // This posts a comment only -- there is no project-sync backend
                // configured in this repo, so no issue/project status field is
                // ever actually changed (see this workflow's own header).
                const pr = context.payload.pull_request;
                let comment = '';

                if (targetStatus === 'To Deploy') {
                  comment = `✅ **PR Merged!**\n\nPR #${pr.number} has been merged to \`${pr.base.ref}\`.\n\nThis issue is ready for deployment.`;
                } else if (targetStatus === 'In Review') {
                  comment = `👀 **PR Ready for Review**\n\nPR #${pr.number} is now ready for code review.\n\nReview PR: ${pr.html_url}`;
                } else if (targetStatus === 'In Progress') {
                  if (pr.merged) {
                    // Skip comment if merged (handled above)
                  } else if (pr.draft) {
                    comment = `📝 **PR Converted to Draft**\n\nPR #${pr.number} was converted to draft. Work continues...`;
                  } else {
                    comment = `🔄 **PR Closed**\n\nPR #${pr.number} was closed without merging. Work can continue on this issue.`;
                  }
                }

                if (comment) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(issueNumber),
                    body: comment
                  });
                  console.log(`✅ Comment added to issue #${issueNumber}`);
                }

                // Small delay between operations
                await new Promise(resolve => setTimeout(resolve, 500));

              } catch (error) {
                console.error(`⚠️  Failed to update issue #${issueNumber}:`, error.message);
                // Continue with other issues
              }
            }

            console.log(`\n✅ Issue status sync completed`);

  # ─────────────────────────────────────────────────────────────────
  # Delete Merged Branch
  # ─────────────────────────────────────────────────────────────────
  delete-merged-branch:
    name: Delete Merged Branch
    runs-on: ubuntu-latest
    needs:
      - fork-check
      - sync-issue-status
    if: |
      always() &&
      needs.fork-check.result == 'success' &&
      needs.fork-check.outputs.should-skip-writes == 'false' &&
      github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Delete source branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            const branchName = pr.head.ref;
            const baseBranch = pr.base.ref;

            console.log(`🗑️  Deleting merged branch: ${branchName}`);

            // Don't delete protected branches
            const protectedBranches = ['main', 'master', 'dev', 'develop', 'staging', 'production'];

            if (protectedBranches.includes(branchName)) {
              console.log(`⚠️  Skipping deletion - ${branchName} is a protected branch`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });

              console.log(`✅ Branch deleted: ${branchName}`);

              // Add comment to PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🗑️ Source branch \`${branchName}\` has been automatically deleted after merge.`
              });

            } catch (error) {
              console.error(`⚠️  Failed to delete branch: ${error.message}`);
              // Don't fail the workflow if branch deletion fails
            }

  # ─────────────────────────────────────────────────────────────────
  # Generate Summary
  # ─────────────────────────────────────────────────────────────────
  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs:
      - fork-check
      - extract-issues
      - sync-issue-status
      - delete-merged-branch
    if: always()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Generate summary
        env:
          # Passed through env, not interpolated directly into the script
          # below: a git branch name can contain characters (e.g. `$()`,
          # backticks) that a direct ${{ }} substitution into a bash script
          # body would let a PR's own branch name execute as shell code
          # (zizmor's template-injection finding, PR #294 review).
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "# 🔄 PR Status Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fork status
          if [[ "${{ needs.fork-check.outputs.is-fork }}" == "true" ]]; then
            echo "⚠️  **Fork PR**: Write operations were skipped for security" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Linked issues
          if [[ "${{ needs.extract-issues.outputs.has-issues }}" != "true" ]]; then
            echo "## ℹ️ No Linked Issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This PR has no linked issues in its description." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To enable automated tracking:**" >> $GITHUB_STEP_SUMMARY
            echo "Add \`Closes #123\` or \`Fixes #456\` to your PR description" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # PR event details
          echo "## 📋 PR Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **State:** ${{ github.event.pull_request.state }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Draft:** ${{ github.event.pull_request.draft }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Merged:** ${{ github.event.pull_request.merged }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Linked issues
          echo "## 🔗 Linked Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ISSUE_NUMBERS="${{ needs.extract-issues.outputs.issue-numbers }}"
          IFS=',' read -ra ISSUES <<< "$ISSUE_NUMBERS"
          for issue in "${ISSUES[@]}"; do
            echo "- [#$issue](../../../issues/$issue)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          # Issue comments
          if [[ "${{ needs.sync-issue-status.result }}" == "success" ]]; then
            echo "## ✅ Issue Comments Posted" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All linked issues were notified of this PR's status change via comment." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Branch deletion
          if [[ "${{ needs.delete-merged-branch.result }}" == "success" ]]; then
            echo "## 🗑️ Branch Cleanup" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Source branch \`$PR_HEAD_REF\` was deleted after merge." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_PR status sync completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')_" >> $GITHUB_STEP_SUMMARY

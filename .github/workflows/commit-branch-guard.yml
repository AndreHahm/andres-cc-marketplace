---
name: Commit & Branch Guard

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to validate
        required: false
  repository_dispatch:
    types: [ci-guard]

jobs:
  guard:
    name: Validate commits and branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Resolve ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_REF" ]]; then
            echo "target_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "repository_dispatch" && -n "$PAYLOAD_REF" ]]; then
            echo "target_ref=$PAYLOAD_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$PAYLOAD_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" && -n "$PR_HEAD_SHA" ]]; then
            echo "target_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "target_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.checkout_ref }}

      - name: Validate branch naming convention
        env:
          BRANCH_NAME: ${{ steps.ref.outputs.target_ref }}
        run: |
          echo "Validating branch name: $BRANCH_NAME"

          # Allow automation branches
          if [[ "$BRANCH_NAME" =~ ^(dependabot|renovate)/.+$ ]]; then
            echo "✅ Branch is managed by automation ($BRANCH_NAME). Allowing."
            exit 0
          fi

          # New naming convention (preferred): feature/, fix/, hotfix/, refactor/, test/, docs/
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|hotfix|refactor|test|docs|chore)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "✅ Branch name follows new convention: $BRANCH_NAME"
            exit 0
          fi

          # Old naming convention (backward compatibility): feat/, fix/, docs/, chore/, etc.
          if [[ "$BRANCH_NAME" =~ ^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|hotfix|release)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "⚠️  Branch name follows old convention: $BRANCH_NAME"
            echo "   Preferred: Use 'feature/' instead of 'feat/', etc."
            echo "   Old convention still allowed for backward compatibility."
            exit 0
          fi

          echo "::error::Branch '$BRANCH_NAME' does not match required pattern."
          echo ""
          echo "Preferred prefixes (new convention):"
          echo "  - feature/  (for new features)"
          echo "  - fix/      (for bug fixes)"
          echo "  - hotfix/   (for critical fixes)"
          echo "  - refactor/ (for code refactoring)"
          echo "  - test/     (for test additions/updates)"
          echo "  - docs/     (for documentation changes)"
          echo ""
          echo "Also accepted (old convention):"
          echo "  - feat/, fix/, docs/, chore/, refactor/, test/, build/, ci/, perf/, style/, hotfix/, release/"
          echo ""
          echo "Automation: dependabot/, renovate/"
          exit 1

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '20'
          # skip-install: this job never installs the repo's own root
          # package.json -- it only ever installs the isolated
          # .github/commitlint-tools/ toolchain below.
          skip-install: 'true'

      - name: Restore commitlint-tools manifest from the trusted base SHA (trust boundary)
        # secretlint's own manifest+lockfile already live in an isolated
        # .github/security-tools/ directory for the identical reason --
        # this mirrors that pattern for commitlint. Unconditional
        # (whenever a manifest genuinely differs at base) rather than
        # relying on --ignore-scripts alone: a PR-committed root .npmrc
        # can redirect a scoped package (e.g. @commitlint:registry) to a
        # malicious registry even with lifecycle scripts disabled, since
        # --ignore-scripts only blocks lifecycle scripts, not package
        # resolution itself (Codex finding, round 2, verified locally:
        # `pnpm config get @secretlint:registry` picked up a repo-root
        # .npmrc override when run at the repo root, but returned
        # `undefined` -- correctly isolated -- when run with cwd inside
        # .github/security-tools/, confirming this per-directory isolation
        # actually holds and closes the same gap here).
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          restore_from_base() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              # Genuinely absent at the trusted base -- this is the
              # bootstrapping PR introducing this isolated toolchain for
              # the first time, so no trusted base copy exists yet to
              # restore; keep the PR's own.
              :
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          restore_from_base .github/commitlint-tools/package.json
          restore_from_base .github/commitlint-tools/pnpm-lock.yaml

      - name: Install commitlint (isolated toolchain)
        # --ignore-scripts: defense-in-depth against a future trusted-base
        # change adding a lifecycle script; the real trust boundary here is
        # the isolated directory + restore step above, which closes the
        # registry-redirection gap --ignore-scripts alone can't.
        run: pnpm --dir .github/commitlint-tools install --frozen-lockfile --ignore-scripts

      - name: Fetch default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin $DEFAULT_BRANCH --depth=1

      - name: Restore commitlint config into the isolated toolchain (trust boundary)
        # Written to .github/commitlint-tools/.commitlintrc.cjs, NOT the
        # repo-root .commitlintrc.cjs: "Run commitlint" below runs with its
        # cwd inside the isolated toolchain directory specifically so
        # @commitlint/config-conventional resolves from ITS OWN install --
        # commitlint's own resolveExtends resolves module specifiers
        # relative to process.cwd() (verified locally: neither --cwd nor
        # -g change that, only actually changing the shell's own working
        # directory does), unlike secretlint's own resolution, which
        # worked correctly from a fixed cwd with only the binary path
        # changed. The repo-root .commitlintrc.cjs is untouched here and
        # stays available for local/human use; this workflow no longer
        # reads it at all.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          stderr_file=$(mktemp)
          if content=$(gh api --method GET "repos/$REPO/contents/.commitlintrc.cjs" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
            echo "$content" | base64 -d > .github/commitlint-tools/.commitlintrc.cjs
          elif grep -q "HTTP 404" "$stderr_file"; then
            # Genuinely absent at the trusted base -- this is the
            # bootstrapping PR introducing it for the first time, so no
            # trusted base copy exists yet to restore; fall back to the
            # PR's own repo-root copy so this first run still has a config.
            cp .commitlintrc.cjs .github/commitlint-tools/.commitlintrc.cjs
          else
            echo "::error::could not verify trusted base-SHA content of .commitlintrc.cjs ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
            rm -f "$stderr_file"
            exit 1
          fi
          rm -f "$stderr_file"

      - name: Run commitlint
        working-directory: .github/commitlint-tools
        env:
          TARGET_REF: ${{ steps.ref.outputs.target_ref }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./node_modules/.bin/commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          else
            BASE_REF=$(git merge-base origin/${{ github.event.repository.default_branch }} "$TARGET_REF")
            ./node_modules/.bin/commitlint --from "$BASE_REF" --to "$TARGET_REF"
          fi

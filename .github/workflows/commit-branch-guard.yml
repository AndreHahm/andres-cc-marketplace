---
name: Commit & Branch Guard

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to validate
        required: false
  repository_dispatch:
    types: [ci-guard]

jobs:
  guard:
    name: Validate commits and branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Resolve ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_REF" ]]; then
            echo "target_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "repository_dispatch" && -n "$PAYLOAD_REF" ]]; then
            echo "target_ref=$PAYLOAD_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$PAYLOAD_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" && -n "$PR_HEAD_SHA" ]]; then
            echo "target_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "target_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.checkout_ref }}

      - name: Validate branch naming convention
        env:
          BRANCH_NAME: ${{ steps.ref.outputs.target_ref }}
        run: |
          echo "Validating branch name: $BRANCH_NAME"

          # Allow automation branches
          if [[ "$BRANCH_NAME" =~ ^(dependabot|renovate)/.+$ ]]; then
            echo "✅ Branch is managed by automation ($BRANCH_NAME). Allowing."
            exit 0
          fi

          # New naming convention (preferred): feature/, fix/, hotfix/, refactor/, test/, docs/
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|hotfix|refactor|test|docs|chore)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "✅ Branch name follows new convention: $BRANCH_NAME"
            exit 0
          fi

          # Old naming convention (backward compatibility): feat/, fix/, docs/, chore/, etc.
          if [[ "$BRANCH_NAME" =~ ^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|hotfix|release)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "⚠️  Branch name follows old convention: $BRANCH_NAME"
            echo "   Preferred: Use 'feature/' instead of 'feat/', etc."
            echo "   Old convention still allowed for backward compatibility."
            exit 0
          fi

          echo "::error::Branch '$BRANCH_NAME' does not match required pattern."
          echo ""
          echo "Preferred prefixes (new convention):"
          echo "  - feature/  (for new features)"
          echo "  - fix/      (for bug fixes)"
          echo "  - hotfix/   (for critical fixes)"
          echo "  - refactor/ (for code refactoring)"
          echo "  - test/     (for test additions/updates)"
          echo "  - docs/     (for documentation changes)"
          echo ""
          echo "Also accepted (old convention):"
          echo "  - feat/, fix/, docs/, chore/, refactor/, test/, build/, ci/, perf/, style/, hotfix/, release/"
          echo ""
          echo "Automation: dependabot/, renovate/"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 20

      - name: Install commitlint
        run: |
          # --ignore-scripts: this install runs in the PR's own checkout, so
          # without it npm would also execute the PR's own package.json
          # preinstall/postinstall/prepare scripts, which could tamper with
          # the commitlint binary itself (in node_modules/.bin) before "Run
          # commitlint" invokes it -- restoring the config alone doesn't
          # close that gap (found by cross-model review).
          npm install --no-save --ignore-scripts @commitlint/cli@18.6.0 @commitlint/config-conventional@18.6.0

      - name: Fetch default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin $DEFAULT_BRANCH --depth=1

      - name: Restore commitlint config from the trusted base SHA (trust boundary)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The checkout above uses the PR's own HEAD content --
          # .commitlintrc.cjs is a CommonJS module that commitlint loads and
          # executes as JS, so a PR that rewrites its own copy could run
          # arbitrary code on this runner. Restore the base branch's own
          # trusted copy immediately before commitlint reads it -- after
          # "Install commitlint" (npm install runs the PR's own
          # package.json lifecycle scripts, which could otherwise
          # re-corrupt a config restored any earlier) -- so commit messages
          # are judged against this repo's own rules, not rules the PR
          # itself could rewrite (same restore-from-base pattern
          # marketplace-ci.yml's Hygiene job already uses for other
          # trust-sensitive files).
          stderr_file=$(mktemp)
          if content=$(gh api --method GET "repos/$REPO/contents/.commitlintrc.cjs" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
            echo "$content" | base64 -d > .commitlintrc.cjs
          elif grep -q "HTTP 404" "$stderr_file"; then
            # Genuinely absent at the trusted base -- this is the
            # bootstrapping PR introducing it for the first time, so no
            # trusted base copy exists yet to restore; keep the PR's own.
            :
          else
            echo "::error::could not verify trusted base-SHA content of .commitlintrc.cjs ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
            rm -f "$stderr_file"
            exit 1
          fi
          rm -f "$stderr_file"

      - name: Run commitlint
        env:
          TARGET_REF: ${{ steps.ref.outputs.target_ref }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          else
            BASE_REF=$(git merge-base origin/${{ github.event.repository.default_branch }} "$TARGET_REF")
            npx commitlint --from "$BASE_REF" --to "$TARGET_REF"
          fi

name: 'Issue Opened Labeler'

on:
  issues:
    types:
      - 'opened'

concurrency:
  group: 'issue-opened-labeler-${{ github.event.issue.number }}'
  cancel-in-progress: true

permissions:
  issues: 'write'

jobs:
  label-issue:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
            .github/WORKFLOW_KILLSWITCH
      - name: 'Check Workflow Kill Switch'
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: 'Track workflow rerun'
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: 'Generate GitHub App Token'
        id: 'generate_token'
        env:
          APP_ID: '${{ secrets.APP_ID }}'
        if: |-
          ${{ env.APP_ID != '' }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2.1.1
        with:
          app-id: '${{ secrets.APP_ID }}'
          private-key: '${{ secrets.PRIVATE_KEY }}'
          # Without an explicit permission-* input, the resulting token
          # inherits the GitHub App installation's FULL permission set, not
          # just what this job's workflow-level `permissions:` block allows
          # -- that block only scopes GITHUB_TOKEN, not an app-generated
          # token (zizmor + CodeRabbit finding, PR #294 review). This job
          # only reads issues and adds a label.
          permission-issues: write

      - name: 'Add s: triage label'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9.0.0
        with:
          github-token: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          script: |-
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const hasLabel = issue.labels.some(l => l.name === 's: triage');
            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['s: triage']
              });
            } else {
              core.info('Issue already has s: triage label. Skipping.');
            }

      - name: 'Label issue by keyword patterns'
        # Issues have no Conventional-Commit title convention to parse (unlike
        # pr-auto-label.yml's CC-prefix step), so this matches free-form
        # keywords against the title+body instead. Owns only t:/p: labels;
        # a: area labels are the separate .github/issue-labeler.yml action's
        # job (issue-auto-label.yml) -- kept non-overlapping deliberately, so
        # this doesn't need the stale-label reconciliation/exclusion-list
        # machinery pr-auto-label.yml required to coexist with labeler.yml
        # (PR #290). This step only ever adds labels, never removes -- issues
        # only trigger it once on "opened", so there's nothing to reconcile.
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9.0.0
        with:
          github-token: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          script: |-
            const issue = context.payload.issue;
            if (!issue) return;

            // Strip content the issue author never actually asserted, before
            // classifying: an HTML comment is template placeholder guidance
            // (e.g. bug_report.md's "<!-- Severity: Critical/... -->"), an
            // unchecked "- [ ] ..." line is a template option the author did
            // NOT select (e.g. skill_improvement.md's "- [ ] Improve
            // SKILL.md documentation"), and a markdown header is a fixed
            // section title present in every issue filed from that template
            // regardless of content (e.g. skill_improvement.md's own
            // "### If Enhancing Documentation:") -- all three were matching
            // literally on unedited template scaffolding regardless of the
            // issue's real content (PR #324 review, Codex, P1). A CHECKED
            // "- [x] ..." line is left alone and still counts. Doesn't chase
            // every possible boilerplate variant -- e.g. feature_request.md's
            // own prompt prose ("What problem does this feature address?")
            // still contributes to t: feature on an unedited issue, which is
            // redundant with, not contradictory to, that template's own
            // "t: enhancement" label -- lower severity than the two false
            // positives this actually fixes, left as a disclosed residual
            // rather than expanding scope to strip all prompt prose too.
            function stripTemplateBoilerplate(s) {
              return s
                .replace(/<!--[\s\S]*?-->/g, ' ')
                .replace(/^\s*-\s*\[\s\]\s.*$/gm, ' ')
                .replace(/^#{1,6}\s.*$/gm, ' ');
            }
            const text = stripTemplateBoilerplate(`${issue.title || ''}\n${issue.body || ''}`);

            // Content -> label patterns. Multiple type labels may apply to
            // the same issue (unlike a PR, which requires exactly one i:
            // impact label) -- see docs/github-label-taxonomy.md. Optional
            // trailing `s` on plural-capable nouns (bugs, exceptions,
            // regressions, etc.) -- a bare trailing \b otherwise blocks the
            // plural form the same way it blocked ".github/workflows" before
            // that fix, since \b needs a boundary right after the matched
            // text and a glued-on "s" is still a word character (PR #324
            // review, CodeRabbit + Codex, independently).
            const patterns = [
              { label: 't: security', regex: /\b(security|vulnerabilit(y|ies)|CVE-\d{4}-\d+|exploits?)\b/i },
              { label: 't: performance', regex: /\b(performance|slow|latency|regressions?|memory leaks?)\b/i },
              { label: 't: documentation', regex: /\b(docs?|documentation|readme|typos?)\b/i },
              { label: 't: bug', regex: /\b(bugs?|crash(es|ed)?|broken|exceptions?|tracebacks?|doesn'?t work|not working)\b/i },
              { label: 't: feature', regex: /\b(feature requests?|features?|enhancements?|proposals?)\b/i },
              { label: 'p: critical', regex: /\b(critical|urgent|blockers?|blocking|asap|production down)\b/i },
            ];

            const existing = new Set((issue.labels || []).map(l => (typeof l === 'string' ? l : l.name)));
            const labelsToAdd = patterns
              .filter(p => p.regex.test(text) && !existing.has(p.label))
              .map(p => p.label);

            if (labelsToAdd.length > 0) {
              core.info(`Adding labels: ${labelsToAdd.join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labelsToAdd
              });
            } else {
              core.info('No keyword-pattern labels to add.');
            }

          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove

      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Check out the PR's merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Verify the trusted base SHA actually resolves in this checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git rev-parse --verify "$BASE_SHA"^{commit}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv

      # This job's own run-codex-review step below is the primary review
      # gate itself, not just a bypass path -- publish only checks this
      # job's bare pass/fail status (needs.codex-review.result), never the
      # generated artifact's content, so a same-repo PR that edits
      # run_codex_review() (or anything it calls) to always exit 0 would
      # defeat the whole review gate with no label, attestation, or
      # variable needed at all (Codex cross-model-review finding).
      # Restoring these paths from the base SHA here -- the pattern
      # compute-scope/publish use for the same class of decision code --
      # was tried and reverted: this job's own dispatched Codex reviewer
      # reads target-path files directly off disk as evidence (confirmed
      # against codex-review-bridge's own briefing text), so overwriting
      # them on disk would silently hide this PR's own real changes there
      # from the reviewer, exactly the failure mode compute-scope/publish
      # don't have (they only use the restored code to make an internal
      # decision, never hand file content to an external reader). Detect
      # instead of substitute: if this PR's own copy of these paths is
      # byte-identical to the trusted base SHA, there is nothing to
      # distrust in the first place; if it differs, the PR is modifying
      # the very code that decides and reports this review's own outcome,
      # which no automated dispatch can safely self-evaluate -- fail
      # closed and require the existing bypass-attestation mechanism (a
      # maintainer manually reviews the change and attests) instead of
      # ever running the review from an unverified copy of its own
      # control-plane code.
      #
      # Scoped to the review-dispatch-critical (Tier 1) module set only --
      # not the whole scripts/ tree -- per issue #351 (direction #3):
      # __main__.py imports every handler's own dependencies lazily,
      # inside that handler's function body (never at module level), so
      # `run-codex-review`/`check-scope-bypass`/`check-bypass`/
      # `resolve-attested-actor` provably never load sync.py/validators.py
      # (Tier 2 -- the mirror/export apply-and-staging side, which only
      # other, non-critical subcommands use) at all -- see
      # tests/marketplace_ci/test_import_isolation.py for the tests
      # proving that isolation holds, both at runtime and statically
      # (source-level, covering a function-local import a shallow runtime
      # probe wouldn't reach). A same-repo PR touching only sync.py/
      # validators.py therefore can't tamper with this job's own
      # review-dispatch decision, so it no longer needs this gate's hard
      # refusal -- it still gets real, non-bypassed reviewer coverage via
      # the ordinary delta-mode dispatch below (BYPASS_INELIGIBLE_PREFIXES
      # in review.py keeps forcing that for any scripts/marketplace_ci
      # change, regardless of tier -- unchanged by this refactor).

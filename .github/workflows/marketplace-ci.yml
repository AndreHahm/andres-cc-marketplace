name: Marketplace CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: marketplace-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene (PR contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --group dev
      - name: Write PR event payload
        env:
          # Never interpolate ${{ }} event data directly into a shell string --
          # untrusted PR title/body content can break shell syntax, or worse,
          # inject commands. Passing it through env: keeps it as inert data.
          PR_EVENT_JSON: ${{ toJson(github.event) }}
        run: echo "$PR_EVENT_JSON" > /tmp/pr-event.json
      - name: Validate PR title, template, and author privilege
        run: uv run python -m scripts.marketplace_ci check-pr --event /tmp/pr-event.json

  python-quality:
    name: Python quality (ruff, ty, pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --group dev
      - run: uv run ruff format --check scripts tests
      - run: uv run ruff check scripts tests
      - run: uv run ty check scripts tests
      - run: uv run pytest -q

  marketplace-parity:
    name: Marketplace mirror/export parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --group dev
      - run: uv run python -m scripts.marketplace_ci check-all --json-output marketplace-check.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: marketplace-check-report
          path: marketplace-check.json

  fork-unsupported:
    name: Fork PR (unsupported — explicit terminal result)
    if: github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail explicitly rather than leave the check pending
        run: |
          echo "::error::Marketplace Codex review does not support fork-origin PRs (no trusted secret access for the Codex API key). This is an explicit, terminal failure, not a silently pending required check."
          exit 1

  codex-review:
    name: Codex delta review
    needs: [hygiene, python-quality, marketplace-parity]
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the PR's merge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Verify the trusted base SHA actually resolves in this checkout
        run: git rev-parse --verify ${{ github.event.pull_request.base.sha }}^{commit}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --group dev

      - name: Set up Node (for the codex CLI and codex-review-bridge)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Codex CLI (pinned version, never floating latest)
        run: npm install -g @openai/codex@0.147.0

      - name: Authenticate and smoke-check the Codex CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: codex --version

      - name: Dispatch reviewers directly, validate output, aggregate findings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python -m scripts.marketplace_ci run-codex-review \
            --base-sha ${{ github.event.pull_request.base.sha }} \
            --output codex-review-result.json

      - name: Upload review result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-review-result
          path: codex-review-result.json
          if-no-files-found: ignore

  publish:
    name: Publish Codex policy result
    needs: [codex-review]
    if: always() && needs.codex-review.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --group dev

      - name: Check attested bypass (comment-plus-label protocol)
        id: bypass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LABELS=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]')
          if ! echo "$LABELS" | jq -e 'index("codex-review-bypassed")' > /dev/null; then
            echo "bypassed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACTOR=$(gh api "repos/$REPO/issues/$PR_NUMBER" --jq '.user.login')
          PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '[.[].body]' > comment-bodies.json
          jq -n --arg actor "$ACTOR" --arg sha "$HEAD_SHA" --arg permission "$PERMISSION" \
            --slurpfile comments comment-bodies.json \
            '{actor: $actor, head_sha: $sha, permission: $permission, comments: $comments[0]}' \
            > bypass-event.json
          if uv run python -m scripts.marketplace_ci check-bypass --event bypass-event.json; then
            echo "bypassed=true" >> "$GITHUB_OUTPUT"
          else
            echo "bypassed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine final policy result
        run: |
          if [ "${{ steps.bypass.outputs.bypassed }}" = "true" ]; then
            echo "Codex review bypassed via attested SHA-bound exception. Never presented as a clean review — deterministic, PR-author-privilege, and branch-protection gates still apply unchanged."
            exit 0
          fi
          if [ "${{ needs.codex-review.result }}" != "success" ]; then
            echo "Codex review job failed, timed out, or found a blocking (Critical/Major) finding."
            exit 1
          fi
          echo "Codex review passed."

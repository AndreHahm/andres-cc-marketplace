          # A pull_request (not pull_request_target) trigger checks out the
          # PR's own content -- including this action's own code and the
          # tracked marker file -- so neither can be evaluated as-is: a
          # same-repo PR's own copy is untrusted input here, the same
          # principle compute-scope's own restore step already applies to
          # scripts/pyproject.toml/uv.lock. Restore each path directly from
          # the trusted base SHA via the Contents API (no git history or
          # fetch-depth needed) before the action below ever runs. This
          # closes the "PR's own copy is stale/tampered" gap; it does not
          # (and structurally cannot, at this level) defend against a PR
          # that removes this very step from its own copy of this workflow
          # file -- the same limitation compute-scope's own restore already
          # accepts for the job structure around it.
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then
                # Genuinely absent at the trusted base -- remove any
                # PR-supplied copy so the check treats it as missing,
                # never trusts PR-controlled content.
                rm -f "$path"
              fi
              # else "keep": this is the bootstrapping PR introducing
              # $path for the first time -- no trusted base copy exists
              # yet to restore, so the PR's own checkout content stays.
              # Only applies to this initiative's own rollout; every
              # later PR's base SHA has a real trusted copy to restore.
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          # The two action files themselves have no safe "missing"
          # fallback -- GitHub Actions can't resolve `uses: ./path` at all
          # if the file is absent, unlike the marker file below, whose
          # absence is already handled gracefully by the action's own
          # logic (defaults to ENABLED).

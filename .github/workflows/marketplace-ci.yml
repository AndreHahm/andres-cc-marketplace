name: Marketplace CI

on:
  pull_request:
    # "labeled" is required so applying the bypass label actually re-triggers
    # a run -- without it, a maintainer's attested bypass would sit inert
    # against an already-failed check with no automatic re-evaluation.
    types: [opened, synchronize, reopened, edited, labeled]

concurrency:
  group: marketplace-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene (PR contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # check-pr's gh api calls (collaborator permission, PR commit list).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore kill-switch enforcement from the trusted base SHA (trust boundary)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A pull_request (not pull_request_target) trigger checks out the
          # PR's own content -- including this action's own code and the
          # tracked marker file -- so neither can be evaluated as-is: a
          # same-repo PR's own copy is untrusted input here, the same
          # principle compute-scope's own restore step already applies to
          # scripts/pyproject.toml/uv.lock. Restore each path directly from
          # the trusted base SHA via the Contents API (no git history or
          # fetch-depth needed) before the action below ever runs. This
          # closes the "PR's own copy is stale/tampered" gap; it does not
          # (and structurally cannot, at this level) defend against a PR
          # that removes this very step from its own copy of this workflow
          # file -- the same limitation compute-scope's own restore already
          # accepts for the job structure around it.
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then
                # Genuinely absent at the trusted base -- remove any
                # PR-supplied copy so the check treats it as missing,
                # never trusts PR-controlled content.
                rm -f "$path"
              fi
              # else "keep": this is the bootstrapping PR introducing
              # $path for the first time -- no trusted base copy exists
              # yet to restore, so the PR's own checkout content stays.
              # Only applies to this initiative's own rollout; every
              # later PR's base SHA has a real trusted copy to restore.
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          # The two action files themselves have no safe "missing"
          # fallback -- GitHub Actions can't resolve `uses: ./path` at all
          # if the file is absent, unlike the marker file below, whose
          # absence is already handled gracefully by the action's own
          # logic (defaults to ENABLED).
          restore_from_base .github/actions/workflow-killswitch/action.yml keep
          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove

      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Verify the trusted base SHA actually resolves in this checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git rev-parse --verify "$BASE_SHA"^{commit}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv

      # check-pr runs below with GH_TOKEN, so it and its dependency install
      # must not come from the PR's own untrusted checkout -- the same
      # principle compute-scope and publish already apply to their own
      # decision code (codex-review refuses instead of restoring, since its
      # reviewers must see the PR's real files). Restores before `uv sync` so
      # the dependency install also comes from the trusted spec. Fails closed
      # if the restore itself cannot complete. Raised by Codex's security
      # review of PR #504.
      #
      # Overwriting files that exist at base is not enough: `git restore`
      # without `--overlay` also deletes tracked files the PR added under
      # scripts/, and the loop below restores or deletes the uv, Python-version
      # and CODEOWNERS/template inputs check-pr reads as data (merge privilege
      # is decided from CODEOWNERS, so the PR's own copy must never be trusted).
      # A restore cannot remove what base never had, so a PR that ADDS an
      # importable top-level name (a module such as yaml.py / yaml.pyc /
      # yaml.so, a <dir>/__init__.* package marker, .venv content, or a
      # top-level symlink) is refused outright. That is a denylist of the
      # forms CPython's importer accepts, not a proof there are no others; the
      # same block is repeated in every job that runs trusted code and
      # tests/marketplace_ci/test_workflow_trusted_restore.py keeps the copies
      # identical. The diff goes to a file first and grep's exit code is read
      # explicitly (0 match, 1 clean, anything else fails closed): piping into
      # `grep -q` under pipefail can fail open when git is killed by SIGPIPE.
      - name: Restore the base SHA's copy of the PR-contract check code and its data inputs (trust boundary)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git restore --source="$BASE_SHA" --staged --worktree -- scripts pyproject.toml uv.lock \
            || { echo "::error::could not restore PR-contract check code from $BASE_SHA -- refusing to trust the PR's own copy of it"; exit 1; }
          for p in uv.toml .python-version .python-versions CODEOWNERS .github/CODEOWNERS docs/CODEOWNERS .github/pull_request_template.md; do
            if git cat-file -e "$BASE_SHA:$p" 2>/dev/null; then
              git restore --source="$BASE_SHA" --staged --worktree -- "$p"
            else
              git rm -q -f --ignore-unmatch -- "$p"
              rm -f -- "$p"
            fi
          done
          # Importable-name shadowing: a PR-added top-level module (.py/.pyc/.so/...), a
          # top-level package marker (<dir>/__init__.*), or .venv content, and a
          # top-level symlink (which can be named like a module and matches no name
          # pattern). A restore cannot remove what base never had, so these are refused.
          git diff -z --no-renames --name-only --diff-filter=AT "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-added-files.z"
          rc=0
          grep -zqE '^[^/]+\.(py|pyc|pyw|pyd|so)$|^[^/]+/__init__\.[^/]+$|^\.venv(/|$)' "$RUNNER_TEMP/pr-added-files.z" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds an importable top-level Python module, a top-level package, or .venv content (or the check could not run, grep exit $rc) -- refusing to run PR-contract checks next to GH_TOKEN. A maintainer must change this check in the PR itself, or admin-merge"
            exit 1
          fi
          git ls-tree -z "$BASE_SHA" > "$RUNNER_TEMP/base-top.z"
          git ls-tree -z HEAD > "$RUNNER_TEMP/head-top.z"
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/base-top.z" > "$RUNNER_TEMP/base-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks at base (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/head-top.z" > "$RUNNER_TEMP/head-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks in the PR (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zvxFf "$RUNNER_TEMP/base-links.z" "$RUNNER_TEMP/head-links.z" > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds or changes a top-level symlink (or the check could not run, grep exit $rc) -- refusing to run PR-contract checks next to GH_TOKEN. A maintainer must change this check in the PR itself, or admin-merge"
            exit 1
          fi
          echo "restored scripts/, pyproject.toml, uv.lock, uv config and CODEOWNERS/template from $BASE_SHA"

      - run: uv sync --locked --no-config --group dev
      - name: Write PR event payload
        env:
          # Never interpolate ${{ }} event data directly into a shell string --
          # untrusted PR title/body content can break shell syntax, or worse,
          # inject commands. Passing it through env: keeps it as inert data.
          PR_EVENT_JSON: ${{ toJson(github.event) }}
        run: echo "$PR_EVENT_JSON" > /tmp/pr-event.json
      - name: Validate PR title, template, and author privilege
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m scripts.marketplace_ci check-pr --event /tmp/pr-event.json

  python-quality:
    name: Python quality (ruff, ty, pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore kill-switch enforcement from the trusted base SHA (trust boundary)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A pull_request (not pull_request_target) trigger checks out the
          # PR's own content -- including this action's own code and the
          # tracked marker file -- so neither can be evaluated as-is: a
          # same-repo PR's own copy is untrusted input here, the same
          # principle compute-scope's own restore step already applies to
          # scripts/pyproject.toml/uv.lock. Restore each path directly from
          # the trusted base SHA via the Contents API (no git history or
          # fetch-depth needed) before the action below ever runs. This
          # closes the "PR's own copy is stale/tampered" gap; it does not
          # (and structurally cannot, at this level) defend against a PR
          # that removes this very step from its own copy of this workflow
          # file -- the same limitation compute-scope's own restore already
          # accepts for the job structure around it.
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then

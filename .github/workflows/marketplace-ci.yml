              if [ "$on_absent" = "remove" ]; then
                # Genuinely absent at the trusted base -- remove any
                # PR-supplied copy so the check treats it as missing,
                # never trusts PR-controlled content.
                rm -f "$path"
              fi
              # else "keep": this is the bootstrapping PR introducing
              # $path for the first time -- no trusted base copy exists
              # yet to restore, so the PR's own checkout content stays.
              # Only applies to this initiative's own rollout; every
              # later PR's base SHA has a real trusted copy to restore.
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          # The two action files themselves have no safe "missing"
          # fallback -- GitHub Actions can't resolve `uses: ./path` at all
          # if the file is absent, unlike the marker file below, whose
          # absence is already handled gracefully by the action's own
          # logic (defaults to ENABLED).
          restore_from_base .github/actions/workflow-killswitch/action.yml keep
          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove

      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      # Check out the PR's own head commit directly, never the async
      # `refs/pull/<n>/merge` ref codex-review below uses -- GitHub computes
      # that merge ref out-of-band and it's known to lag a just-pushed head,
      # which would let this job's scope decision (and, on a false
      # bypass_eligible=true, whether codex-review runs at all) disagree
      # with what actually got pushed. A security review flagged this as a
      # real TOCTOU gap once two independent jobs each resolve their own
      # checkout instead of one.
      - name: Check out the PR's own head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify the trusted base SHA actually resolves in this checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git rev-parse --verify "$BASE_SHA"^{commit}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv

      # The PR's diff must never be scored using decision code or a
      # dependency spec the PR itself could have edited -- same
      # trusted-base-SHA principle prepare_reviewer_instruction already
      # applies to reviewer instructions (review.py), applied here to the
      # scope/bypass decision code and what it depends on. `git diff
      # base...HEAD` below compares commit objects, not the working tree,
      # so restoring these paths has no effect on which paths get scored --
      # only on which code (and which dependencies) score them. Runs before
      # `uv sync` so the dependency install itself also comes from the
      # trusted spec, not the PR's own pyproject.toml/uv.lock. `scripts`
      # (the whole tree, not just scripts/marketplace_ci) also covers
      # scripts/__init__.py, which `python -m scripts.marketplace_ci`
      # imports before any restored module runs. Fails the job (and, via
      # publish's SCOPE_RESULT gate, the whole Codex policy check) if the
      # restore itself can't complete -- never silently falls back to
      # scoring with the PR's own copy. On this initiative's own
      # bootstrapping PR the restore still succeeds (scripts/, pyproject.toml,
      # and uv.lock already exist at base_sha), so this only ever
      # short-circuits check-scope-bypass's own unrecognized-subcommand
      # exit further down, not this step. See review.py's own
      # BYPASS_INELIGIBLE_PREFIXES comment for what this trust boundary
      # does and doesn't guarantee.
      - name: Restore the base SHA's copy of the scope-decision code and its dependency spec (trust boundary)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git checkout "$BASE_SHA" -- scripts pyproject.toml uv.lock; then
            echo "restored scripts/, pyproject.toml, uv.lock from $BASE_SHA"
          else
            echo "::error::could not restore scope-decision code from $BASE_SHA -- refusing to score using the PR's own copy of it"
            exit 1
          fi

      - run: uv sync --group dev

      - name: Determine whether this PR's diff is eligible for the automatic reviewer-scope bypass
        id: scope
        env:
          # Never interpolate ${{ }} event data directly into a shell string
          # -- keeps these as inert data, matching hygiene's own PR_EVENT_JSON
          # convention above. before/after are only populated on a
          # `synchronize` event; empty on every other pull_request action.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # Deliberately defaults to bypass_eligible=false (i.e. codex-review
          # runs normally) if the scope computation itself fails for any
          # reason -- fail closed on an infrastructure error, never silently
          # skip Codex review because this step broke.
          set +e
          uv run python -m scripts.marketplace_ci check-scope-bypass \
            --base-sha "$BASE_SHA" \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --json-output scope-bypass.json
          rc=$?
          set -e
          value="false"
          if [ $rc -eq 0 ] && [ -f scope-bypass.json ]; then
            candidate=$(jq -r '.bypass_eligible' scope-bypass.json 2>/dev/null || echo "")
            if [ "$candidate" = "true" ]; then
              value="true"
            fi
          fi
          echo "bypass_eligible=$value" >> "$GITHUB_OUTPUT"

  codex-review:
    name: Codex delta review
    needs: [hygiene, python-quality, marketplace-parity, compute-scope]
    if: github.event.pull_request.head.repo.fork == false && needs.compute-scope.outputs.bypass_eligible != 'true'

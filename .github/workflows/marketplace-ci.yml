              exit 1
            fi
            rm -f "$stderr_file"
          }
          # The two action files themselves have no safe "missing"
          # fallback -- GitHub Actions can't resolve `uses: ./path` at all
          # if the file is absent, unlike the marker file below, whose
          # absence is already handled gracefully by the action's own
          # logic (defaults to ENABLED).
          restore_from_base .github/actions/workflow-killswitch/action.yml keep
          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove

      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Verify the trusted base SHA actually resolves in this checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git rev-parse --verify "$BASE_SHA"^{commit}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv

      # This job's own enforcement logic (scripts/marketplace_ci/__main__.py's
      # check-prefixes/check-prefix-permanence handlers, prefix_check.py's
      # own comparison/validation functions) must never run from the PR's
      # own untrusted checkout -- same principle compute-scope/codex-review/
      # publish already apply to their own decision code. Without this, a
      # same-repo PR could edit _handle_check_prefixes/
      # _handle_check_prefix_permanence to always return 0 in the same
      # commit that reassigns/misregisters a prefix, defeating this whole
      # gate with no label or attestation needed (Codex cross-model-review
      # findings, F1 round 2 and F1 round 5 -- marketplace-parity's own
      # check-all also runs check-prefixes, but from the untrusted PR
      # checkout with no restore of its own; this job is check-prefixes'
      # one trusted evaluation point, marketplace-parity's copy stays
      # best-effort only, the same characteristic that job's pre-existing
      # check-plugin-mirrors/check-codex-exports constituents already have).
      #
      # There is deliberately no bootstrapping exception left here: check-prefixes
      # and check-prefix-permanence have existed at the base SHA since the PR that
      # introduced them. If they were ever missing the restore below still runs and
      # this job fails closed, rather than running the PR's own copy of the code
      # (a former conditional skipped the restore whenever a text probe of base's
      # __main__.py failed, which could only ever fail open).
      - name: Restore the base SHA's copy of the prefix-check code and its dependency spec (trust boundary)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Same restore as the hygiene job's (see its comment): no-overlay
          # restore deletes PR-added files under scripts/, uv.toml, .python-version
          # and .python-versions are restored or deleted, and an importable
          # top-level shadow (module, package, .venv, symlink) is refused.
          set -euo pipefail
          git restore --source="$BASE_SHA" --staged --worktree -- scripts pyproject.toml uv.lock \
            || { echo "::error::could not restore prefix-check code from $BASE_SHA -- refusing to trust the PR's own copy of it"; exit 1; }
          for p in uv.toml .python-version .python-versions; do
            if git cat-file -e "$BASE_SHA:$p" 2>/dev/null; then
              git restore --source="$BASE_SHA" --staged --worktree -- "$p"
            else
              git rm -q -f --ignore-unmatch -- "$p"
              rm -f -- "$p"
            fi
          done
          # Importable-name shadowing: a PR-added top-level module (.py/.pyc/.so/...), a
          # top-level package marker (<dir>/__init__.*), or .venv content, and a
          # top-level symlink (which can be named like a module and matches no name
          # pattern). A restore cannot remove what base never had, so these are refused.
          git diff -z --no-renames --name-only --diff-filter=AT "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-added-files.z"
          rc=0
          grep -zqE '^[^/]+\.(py|pyc|pyw|pyd|so)$|^[^/]+/__init__\.[^/]+$|^\.venv(/|$)' "$RUNNER_TEMP/pr-added-files.z" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds an importable top-level Python module, a top-level package, or .venv content (or the check could not run, grep exit $rc) -- refusing to trust the PR's own copy of the prefix-check code. A maintainer must change this check in the PR itself, or admin-merge"
            exit 1
          fi
          git ls-tree -z "$BASE_SHA" > "$RUNNER_TEMP/base-top.z"
          git ls-tree -z HEAD > "$RUNNER_TEMP/head-top.z"
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/base-top.z" > "$RUNNER_TEMP/base-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks at base (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/head-top.z" > "$RUNNER_TEMP/head-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks in the PR (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zvxFf "$RUNNER_TEMP/base-links.z" "$RUNNER_TEMP/head-links.z" > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds or changes a top-level symlink (or the check could not run, grep exit $rc) -- refusing to trust the PR's own copy of the prefix-check code. A maintainer must change this check in the PR itself, or admin-merge"
            exit 1
          fi
          echo "restored scripts/, pyproject.toml, uv.lock and uv config from $BASE_SHA"

      - run: uv sync --locked --no-config --group dev
      # Mechanical enforcement of plugin-rulebook's R33 (every file under a
      # registered, prefixed plugin's in-scope directories must carry that
      # plugin's own `<prefix>-` basename) plus format/uniqueness
      # validation of every registered prefix itself and a cross-check of
      # marketplace-inventory.json's own `source` field against the
      # authoritative marketplace.json entry -- run from the trusted-
      # restored code above, so a same-repo PR can't weaken this evaluation
      # in the same commit that violates it. Still reads the PR's own
      # .claude-plugin/marketplace-inventory.json and plugin trees
      # (untouched by the restore above, which only covers scripts/), so
      # the PR's actual changes are what's evaluated, just never by the
      # PR's own copy of the evaluation logic.
      - name: Check plugin file prefixes (R33)
        run: uv run python -m scripts.marketplace_ci check-prefixes
      # PR-review-time enforcement that a plugin's registered
      # component-file prefix (plugin-rulebook R33) is actually permanent:
      # reconcile.apply_update's own write-once guard only protects the
      # marketplace-inventory.py CLI's own `update` path -- it does
      # nothing against a hand-edited marketplace-inventory.json, or a
      # delete-and-rebootstrap, committed directly in a PR. This compares
      # the file's own content across the PR's diff (base vs head), which
      # is the layer that actually catches either of those (security-
      # reviewer finding, M2).
      - name: Check plugin prefix permanence (R33)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python -m scripts.marketplace_ci check-prefix-permanence --base-sha "$BASE_SHA"

  fork-unsupported:
    name: Fork PR (unsupported — explicit terminal result)
    if: github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Restore kill-switch enforcement from the trusted base SHA (trust boundary)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A pull_request (not pull_request_target) trigger checks out the
          # PR's own content -- including this action's own code and the
          # tracked marker file -- so neither can be evaluated as-is: a
          # same-repo PR's own copy is untrusted input here, the same
          # principle compute-scope's own restore step already applies to
          # scripts/pyproject.toml/uv.lock. Restore each path directly from
          # the trusted base SHA via the Contents API (no git history or
          # fetch-depth needed) before the action below ever runs. This
          # closes the "PR's own copy is stale/tampered" gap; it does not
          # (and structurally cannot, at this level) defend against a PR
          # that removes this very step from its own copy of this workflow
          # file -- the same limitation compute-scope's own restore already
          # accepts for the job structure around it.
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then
                # Genuinely absent at the trusted base -- remove any
                # PR-supplied copy so the check treats it as missing,
                # never trusts PR-controlled content.
                rm -f "$path"
              fi
              # else "keep": this is the bootstrapping PR introducing
              # $path for the first time -- no trusted base copy exists
              # yet to restore, so the PR's own checkout content stays.
              # Only applies to this initiative's own rollout; every
              # later PR's base SHA has a real trusted copy to restore.
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          # The two action files themselves have no safe "missing"
          # fallback -- GitHub Actions can't resolve `uses: ./path` at all
          # if the file is absent, unlike the marker file below, whose
          # absence is already handled gracefully by the action's own
          # logic (defaults to ENABLED).
          restore_from_base .github/actions/workflow-killswitch/action.yml keep
          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove

      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Fail explicitly rather than leave the check pending
        run: |
          echo "::error::Marketplace Codex review does not support fork-origin PRs (no trusted secret access for the Codex API key). This is an explicit, terminal failure, not a silently pending required check."
          exit 1

  compute-scope:
    name: Compute Codex review scope
    if: github.event.pull_request.head.repo.fork == false

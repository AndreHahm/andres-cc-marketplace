          restore_from_base .github/actions/workflow-killswitch/action.yml keep
          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove

      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --group dev
      - run: uv run ruff format --check scripts tests
      - run: uv run ruff check scripts tests
      - run: uv run ty check scripts tests
      - run: uv run pytest -q

  marketplace-parity:
    name: Marketplace mirror/export parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore kill-switch enforcement from the trusted base SHA (trust boundary)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A pull_request (not pull_request_target) trigger checks out the
          # PR's own content -- including this action's own code and the
          # tracked marker file -- so neither can be evaluated as-is: a
          # same-repo PR's own copy is untrusted input here, the same
          # principle compute-scope's own restore step already applies to
          # scripts/pyproject.toml/uv.lock. Restore each path directly from
          # the trusted base SHA via the Contents API (no git history or
          # fetch-depth needed) before the action below ever runs. This

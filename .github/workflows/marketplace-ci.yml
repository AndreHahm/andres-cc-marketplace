        uses: ./.github/actions/track-rerun

      - name: Fail explicitly rather than leave the check pending
        run: |
          echo "::error::Marketplace Codex review does not support fork-origin PRs (no trusted secret access for the Codex API key). This is an explicit, terminal failure, not a silently pending required check."
          exit 1

  compute-scope:
    name: Compute Codex review scope
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bypass_eligible: ${{ steps.scope.outputs.bypass_eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Restore kill-switch enforcement from the trusted base SHA (trust boundary)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A pull_request (not pull_request_target) trigger checks out the
          # PR's own content -- including this action's own code and the
          # tracked marker file -- so neither can be evaluated as-is: a
          # same-repo PR's own copy is untrusted input here, the same
          # principle compute-scope's own restore step already applies to
          # scripts/pyproject.toml/uv.lock. Restore each path directly from
          # the trusted base SHA via the Contents API (no git history or
          # fetch-depth needed) before the action below ever runs. This
          # closes the "PR's own copy is stale/tampered" gap; it does not
          # (and structurally cannot, at this level) defend against a PR
          # that removes this very step from its own copy of this workflow
          # file -- the same limitation compute-scope's own restore already
          # accepts for the job structure around it.
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"

      # run-codex-review's own import closure (a security review of this
      # split confirmed it) -- it's gated here for a distinct reason: it's
      # merge-privilege-deciding code (`check_merge_rights`'s CODEOWNERS
      # matching), evaluated by the `hygiene` job's `check-pr` step. That
      # job now restores its code and data inputs from the base SHA too (as
      # `compute-scope`/`publish` do), but this file stays in the list until
      # a separate decision says otherwise: reclassifying it alongside
      # sync.py/validators.py would let a same-repo PR tamper with its own
      # merge-privilege evaluation with only automated (not mandatory
      # human) review if that restore were ever bypassed or removed. This list must stay in sync with review.py's own
      # comment note if either changes (R20 duplicate-fact-sweep risk --
      # both are hand-duplicated restatements of the same Tier 1 file set,
      # by necessity: this is a shell pathspec list, review.py's is a
      # Python tuple, and neither can `$ref` the other) --
      # tests/marketplace_ci/test_import_isolation.py's
      # test_workflow_hard_refuse_gate_pathspec_matches_tier1_file_set
      # cross-checks the two mechanically rather than relying on this
      # comment alone.
      - name: Refuse automated Codex dispatch when this PR modifies review-dispatch-critical code (trust boundary)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Three-dot (merge-base) diff, not two-dot: this job checks out
          # refs/pull/<n>/merge, which always reflects the *current* base
          # branch tip, while $BASE_SHA can lag behind it (e.g. no push to
          # this PR since an unrelated, already-merged PR touched one of
          # these paths after $BASE_SHA). A two-dot diff against $BASE_SHA
          # would compare the full trees and pick up that unrelated
          # upstream change too, failing this gate closed for a PR that
          # never touched these paths itself (CodeRabbit finding).
          # Three-dot scopes the comparison to commits reachable from HEAD
          # but not from $BASE_SHA -- this PR's own changes only, matching
          # the base...head convention check-pr already uses.
          if ! git diff --quiet "$BASE_SHA"...HEAD -- \
              scripts/__init__.py \
              scripts/marketplace_ci/__init__.py \
              scripts/marketplace_ci/__main__.py \
              scripts/marketplace_ci/review.py \
              scripts/marketplace_ci/git_state.py \
              scripts/marketplace_ci/registry.py \
              scripts/marketplace_ci/sync_plan.py \
              scripts/marketplace_ci/conversion.py \
              scripts/marketplace_ci/pr_policy.py \
              pyproject.toml \
              uv.lock \
              uv.toml \
              .python-version \
              .python-versions \
              plugins/codex-kit/skills/codex-review-bridge/scripts/bridge-invoke.mjs \
              plugins/codex-kit/scripts/lib/codex-exec.mjs \
              plugins/codex-kit/scripts/lib/cdx-process.mjs; then
            echo "::error::This PR changes review-dispatch-critical code (scripts/__init__.py, scripts/marketplace_ci/{__init__,__main__,review,git_state,registry,sync_plan,conversion,pr_policy}.py) or its dependency spec or uv/Python-version config (pyproject.toml, uv.lock, uv.toml, .python-version, .python-versions), or the Node bridge this job runs with the API key (plugins/codex-kit/skills/codex-review-bridge/scripts/bridge-invoke.mjs, plugins/codex-kit/scripts/lib/codex-exec.mjs, plugins/codex-kit/scripts/lib/cdx-process.mjs) -- the same code this job dispatches reviewers with and hands to them as evidence on disk. Neither running the PR's own copy (a same-repo PR could tamper with the review-dispatch logic itself) nor restoring the trusted base-SHA copy (which would silently hide this PR's real changes to those paths from the reviewer) is safe here. This requires a maintainer to manually review the change and attest a bypass (the comment-plus-label protocol, or the CODEX_CI_REVIEW_BYPASS variable) rather than an automated Codex dispatch."
            exit 1
          fi

      # codex-review cannot restore scripts/ or the uv config from base the way the
      # other jobs do -- the reviewers must see this PR's real changes on disk -- so it
      # refuses instead: the hard-refuse step above covers the Tier-1 Python code, the
      # uv and Python-version config files and the three Node files this job runs with
      # the key, and this step covers files the PR ADDS that could shadow an import next
      # to OPENAI_API_KEY (the same check the restore jobs run, plus scripts/-specific
      # forms and symlinks). A SHA-bound bypass attestation clears these refusals; it
      # does not clear the restore jobs'. The `uv sync` below is then locked and
      # config-free.
      - name: Refuse automated Codex dispatch when this PR adds an importable top-level shadow (trust boundary)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Unlike the restore jobs, this job runs scripts/ from the PR's own checkout, so a
          # file the PR adds BELOW the top level can still replace an unchanged Tier-1 module:
          # a package directory named after one (scripts/marketplace_ci/review/__init__.py),
          # a compiled extension or sourceless bytecode (review.so, review.pyc), or a cached
          # __pycache__ entry (loaded without checking the source when it is hash-based).
          git diff -z --no-renames --name-only --diff-filter=AT "$BASE_SHA" HEAD -- scripts > "$RUNNER_TEMP/scripts-added-files.z"
          rc=0
          grep -zqE '^scripts/(.*/)?__pycache__(/|$)|^scripts/.*\.(pyc|pyw|pyd|so)$|^scripts/.*/__init__\.|^scripts/marketplace_ci/(__init__|__main__|review|git_state|registry|sync_plan|conversion|pr_policy)(/|$)' "$RUNNER_TEMP/scripts-added-files.z" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds a file under scripts/ that could replace a review-dispatch-critical module (a same-named package, an extension or bytecode file, or a __pycache__ entry), or the check could not run (grep exit $rc) -- refusing to dispatch Codex reviewers with the API key over this PR's files. A maintainer must review the change and attest a bypass (the comment-plus-label protocol, or the CODEX_CI_REVIEW_BYPASS variable)"
            exit 1
          fi

          # A symlink anywhere under scripts/ can stand in for a module or package (it is one
          # path with no trailing slash, so the name patterns above do not see it).
          git diff -z --raw --no-renames --diff-filter=AT "$BASE_SHA" HEAD -- scripts > "$RUNNER_TEMP/scripts-raw.z"
          rc=0
          grep -zqE '^:[0-7]+ 120000 ' "$RUNNER_TEMP/scripts-raw.z" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds or changes a symlink under scripts/ (or the check could not run, grep exit $rc) -- refusing to dispatch Codex reviewers with the API key over this PR's files. A maintainer must review the change and attest a bypass (the comment-plus-label protocol, or the CODEX_CI_REVIEW_BYPASS variable)"
            exit 1
          fi
          # Importable-name shadowing: a PR-added top-level module (.py/.pyc/.so/...), a
          # top-level package marker (<dir>/__init__.*), or .venv content, and a
          # top-level symlink (which can be named like a module and matches no name
          # pattern). A restore cannot remove what base never had, so these are refused.
          git diff -z --no-renames --name-only --diff-filter=AT "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-added-files.z"
          rc=0
          grep -zqE '^[^/]+\.(py|pyc|pyw|pyd|so)$|^[^/]+/__init__\.[^/]+$|^\.venv(/|$)' "$RUNNER_TEMP/pr-added-files.z" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds an importable top-level Python module, a top-level package, or .venv content (or the check could not run, grep exit $rc) -- refusing to dispatch Codex reviewers with the API key over this PR's files. A maintainer must review the change and attest a bypass (the comment-plus-label protocol, or the CODEX_CI_REVIEW_BYPASS variable)"
            exit 1
          fi
          git ls-tree -z "$BASE_SHA" > "$RUNNER_TEMP/base-top.z"
          git ls-tree -z HEAD > "$RUNNER_TEMP/head-top.z"
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/base-top.z" > "$RUNNER_TEMP/base-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks at base (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/head-top.z" > "$RUNNER_TEMP/head-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks in the PR (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zvxFf "$RUNNER_TEMP/base-links.z" "$RUNNER_TEMP/head-links.z" > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds or changes a top-level symlink (or the check could not run, grep exit $rc) -- refusing to dispatch Codex reviewers with the API key over this PR's files. A maintainer must review the change and attest a bypass (the comment-plus-label protocol, or the CODEX_CI_REVIEW_BYPASS variable)"
            exit 1
          fi

      - run: uv sync --locked --no-config --group dev

      - name: Set up Node (for the codex CLI and codex-review-bridge)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Install Codex CLI (pinned version, never floating latest)
        run: npm install -g @openai/codex@0.147.0

      - name: Authenticate and smoke-check the Codex CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex --version

      - name: Dispatch reviewers directly, validate output, aggregate findings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: pin the model every dispatched reviewer uses, overriding
          # whatever ~/.codex/config.toml resolves after `codex login` above
          # (account/API-key default, not something this repo controls).
          # Unset by default -- vars.* (not secrets.*) since a model slug
          # isn't sensitive. See docs/ci.md.
          CODEX_KIT_REVIEW_MODEL: ${{ vars.CODEX_KIT_REVIEW_MODEL }}
          # Per-dispatch Codex exec budget, overriding the shared 240000ms
          # (4 min) default every other codex-review-bridge caller uses.
          # A large delta PR can legitimately push one reviewer's single-call
          # review past that default (confirmed live, PR #41: a 100-path
          # delta caused a timeout). This job's own 45-minute budget above
          # has headroom for a longer per-reviewer budget across the several
          # reviewers dispatched in one run (two at a time, with timeout
          # retries inside a 40-minute dispatch budget). See docs/ci.md.
          CODEX_KIT_REVIEW_TIMEOUT_MS: "600000"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run python -m scripts.marketplace_ci run-codex-review \
            --base-sha "$BASE_SHA" \
            --output codex-review-result.json

      - name: Upload review result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: codex-review-result
          path: codex-review-result.json
          if-no-files-found: ignore

  publish:
    name: Publish Codex policy result
    needs: [compute-scope, codex-review, prefix-permanence]
    # Always runs for a same-repo PR (fork-unsupported owns the fork case
    # and already fails explicitly, independently of this job) -- a
    # security review found the earlier `needs.codex-review.result !=
    # 'skipped'` gate fails OPEN when compute-scope itself fails or is
    # cancelled: a failed `needs` job makes the dependent job's result
    # 'skipped' by default, so codex-review.result becomes 'skipped' too,
    # and this job never ran to say otherwise -- exactly what "skipped
    # satisfies a required check" is supposed to mean only for the
    # legitimate bypass-eligible case. The "Determine final policy result"
    # step below now explicitly checks compute-scope's own result before
    # trusting codex-review's skip as legitimate. `prefix-permanence` was
    # added to codex-review's own `needs` when that job was introduced, but
    # this job's policy-result step wasn't updated to match: an
    # inventory-only PR can be `bypass_eligible=true` (unrelated to
    # prefix-permanence) while ALSO failing prefix-permanence -- that
    # failure makes codex-review 'skipped' as a side effect of its own
    # failed dependency, which this job's policy step, seeing
    # bypass_eligible=true, would otherwise accept as a legitimate skip.
    # prefix-permanence is now both a direct dependency here and
    # independently checked below, closing that gap. Found by CodeRabbit,
    # round 9.
    if: always() && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the trusted base SHA actually resolves in this checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git rev-parse --verify "$BASE_SHA"^{commit}
      - name: Restore kill-switch enforcement from the trusted base SHA (trust boundary)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A pull_request (not pull_request_target) trigger checks out the
          # PR's own content -- including this action's own code and the
          # tracked marker file -- so neither can be evaluated as-is: a
          # same-repo PR's own copy is untrusted input here, the same
          # principle compute-scope's own restore step already applies to
          # scripts/pyproject.toml/uv.lock. Restore each path directly from
          # the trusted base SHA via the Contents API (no git history or
          # fetch-depth needed) before the action below ever runs. This
          # closes the "PR's own copy is stale/tampered" gap; it does not
          # (and structurally cannot, at this level) defend against a PR
          # that removes this very step from its own copy of this workflow
          # file -- the same limitation compute-scope's own restore already
          # accepts for the job structure around it.
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then
                # Genuinely absent at the trusted base -- remove any
                # PR-supplied copy so the check treats it as missing,
                # never trusts PR-controlled content.
                rm -f "$path"
              fi
              # else "keep": this is the bootstrapping PR introducing
              # $path for the first time -- no trusted base copy exists
              # yet to restore, so the PR's own checkout content stays.
              # Only applies to this initiative's own rollout; every
              # later PR's base SHA has a real trusted copy to restore.
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          # The two action files themselves have no safe "missing"
          # fallback -- GitHub Actions can't resolve `uses: ./path` at all
          # if the file is absent, unlike the marker file below, whose
          # absence is already handled gracefully by the action's own
          # logic (defaults to ENABLED).
          restore_from_base .github/actions/workflow-killswitch/action.yml keep
          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove

      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv

      # This job's own bypass check below runs resolve-attested-actor/
      # check-bypass from scripts/marketplace_ci/review.py -- the same
      # class of decision code compute-scope's own restore step already
      # protects for its scope/bypass-eligibility decision. Without this,
      # a same-repo PR could edit resolve_attested_actor()/check_bypass()
      # in its own checkout to force a bypass past the SHA-bound
      # attestation gate (Codex cross-model-review finding). Runs before
      # `uv sync` so the dependency install itself also comes from the
      # trusted spec, not the PR's own pyproject.toml/uv.lock.
      - name: Restore the base SHA's copy of the bypass-validation code and its dependency spec (trust boundary)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Same restore as the hygiene job's (see its comment): no-overlay
          # restore deletes PR-added files under scripts/, uv.toml, .python-version
          # and .python-versions are restored or deleted, and an importable
          # top-level shadow (module, package, .venv, symlink) is refused.
          set -euo pipefail
          git restore --source="$BASE_SHA" --staged --worktree -- scripts pyproject.toml uv.lock \
            || { echo "::error::could not restore bypass-validation code from $BASE_SHA -- refusing to trust the PR's own copy of it"; exit 1; }
          for p in uv.toml .python-version .python-versions; do
            if git cat-file -e "$BASE_SHA:$p" 2>/dev/null; then
              git restore --source="$BASE_SHA" --staged --worktree -- "$p"
            else
              git rm -q -f --ignore-unmatch -- "$p"
              rm -f -- "$p"
            fi
          done
          # Importable-name shadowing: a PR-added top-level module (.py/.pyc/.so/...), a
          # top-level package marker (<dir>/__init__.*), or .venv content, and a
          # top-level symlink (which can be named like a module and matches no name
          # pattern). A restore cannot remove what base never had, so these are refused.
          git diff -z --no-renames --name-only --diff-filter=AT "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-added-files.z"
          rc=0
          grep -zqE '^[^/]+\.(py|pyc|pyw|pyd|so)$|^[^/]+/__init__\.[^/]+$|^\.venv(/|$)' "$RUNNER_TEMP/pr-added-files.z" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds an importable top-level Python module, a top-level package, or .venv content (or the check could not run, grep exit $rc) -- refusing to trust the PR's own copy of the code. A maintainer must change this check in the PR itself, or admin-merge"
            exit 1
          fi
          git ls-tree -z "$BASE_SHA" > "$RUNNER_TEMP/base-top.z"
          git ls-tree -z HEAD > "$RUNNER_TEMP/head-top.z"
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/base-top.z" > "$RUNNER_TEMP/base-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks at base (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zE '^120000 ' "$RUNNER_TEMP/head-top.z" > "$RUNNER_TEMP/head-links.z" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::could not list top-level symlinks in the PR (grep exit $rc)"; exit 1; fi
          rc=0
          grep -zvxFf "$RUNNER_TEMP/base-links.z" "$RUNNER_TEMP/head-links.z" > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::this PR adds or changes a top-level symlink (or the check could not run, grep exit $rc) -- refusing to trust the PR's own copy of the code. A maintainer must change this check in the PR itself, or admin-merge"
            exit 1
          fi
          echo "restored scripts/, pyproject.toml, uv.lock and uv config from $BASE_SHA"

      - run: uv sync --locked --no-config --group dev

      - name: Check attested bypass (comment-plus-label protocol, or CODEX_CI_REVIEW_BYPASS var)
        id: bypass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEX_CI_REVIEW_BYPASS: ${{ vars.CODEX_CI_REVIEW_BYPASS }}
        run: |
          set -euo pipefail
          # Scratch JSON files are transient workflow artifacts, not
          # repository content -- write them under $RUNNER_TEMP (a
          # per-job scratch directory), never as bare relative filenames
          # that would otherwise land in the checkout root (AGENTS.md's
          # "No Scratch Files at Repo Root" policy; Codex cross-model-
          # review finding).
          SCRATCH="$RUNNER_TEMP"
          # Repo-variable path: NEVER a bypass by itself -- it only lets this
          # check look for a valid attestation on a run that wasn't triggered
          # by applying the label (e.g. a plain push/synchronize), when no
          # `labeled` event exists to resolve a trusted actor from. Every one
          # of check_bypass's own requirements (an exact head-SHA match, a
          # non-empty reason, live write/maintain/admin permission) still
          # applies unchanged, and the attesting actor is resolved from the
          # comment's REAL GitHub author, never the marker's own
          # self-declared "actor" field -- security-reviewer finding: the
          # original version of this path granted bypassed=true
          # unconditionally, repo-wide, with no attestation, actor, or SHA
          # check of any kind.
          if [ -n "$CODEX_CI_REVIEW_BYPASS" ]; then
            case "$CODEX_CI_REVIEW_BYPASS" in
              0) : ;;
              1)
                # --paginate's own raw output is one JSON array PER page,
                # concatenated -- not one merged array (confirmed via
                # `gh api --help`: "Each page is a separate JSON array or
                # object. Pass --slurp to wrap all pages...into an outer
                # JSON array."). Applying --jq inline on a --paginate call
                # only transforms each page independently, so a PR with
                # more than one page of comments (default ~30/page) would
                # otherwise produce multiple concatenated JSON values here
                # -- which resolve-attested-actor's own json.loads cannot
                # parse (verified live: raises JSONDecodeError). Fetch raw
                # pages with no inline --jq, then merge with a separate
                # `jq -s` (slurp) pass that flattens every page's array
                # into one before applying the actual transform.
                gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                  | jq -s '[.[] | .[] | {login: (.user.login // ""), body: .body}]' \
                  > "$SCRATCH/comments-with-login.json"
                # resolve-attested-actor's own tested exit-code contract
                # distinguishes exit 1 (no match -- a legitimate, expected
                # outcome) from exit 2 (an infrastructure/configuration
                # failure, e.g. an unreadable or malformed input file). A
                # blanket `|| true` here would swallow both alike, silently
                # reporting bypassed=false for an infra failure too --
                # exactly the "|| true ... on an infrastructure error is a
                # regression, not a fix" pattern AGENTS.md's CI/review
                # infrastructure section names directly (Codex cross-model-
                # review finding). Disable errexit only for this one call so
                # its real exit code can be inspected before deciding.
                # A later commenter with no write access (or a bot) can post a
                # valid self-attestation for the same SHA; picking the most
                # recent attester outright would let it shadow the real
                # maintainer's earlier one and fail this emergency path
                # closed. List the distinct attesting logins, look up each
                # one's live permission, and let resolve-attested-actor pick
                # the most recent bypass-capable non-bot one. Logins come
                # from the API but are still shape-checked before they are
                # used in a URL path.
                set +e
                CANDIDATES=$(uv run python -m scripts.marketplace_ci resolve-attested-actor \
                  --comments-with-login "$SCRATCH/comments-with-login.json" --head-sha "$HEAD_SHA" \
                  --list-candidates)
                cand_exit=$?
                set -e
                if [ "$cand_exit" -eq 2 ]; then
                  echo "::error::resolve-attested-actor --list-candidates exited 2 (infrastructure/configuration failure, not a normal no-match) -- see stderr above. Refusing to silently report bypassed=false for this."
                  exit 1
                fi
                echo '{}' > "$SCRATCH/candidate-permissions.json"
                while IFS= read -r CANDIDATE; do
                  [ -n "$CANDIDATE" ] || continue
                  case "$CANDIDATE" in *[!A-Za-z0-9-]*) continue ;; esac
                  CAND_PERMISSION=$(gh api "repos/$REPO/collaborators/$CANDIDATE/permission" --jq '.permission' 2>/dev/null </dev/null || echo "none")
                  jq --arg login "$CANDIDATE" --arg permission "$CAND_PERMISSION" \
                    '. + {($login): $permission}' "$SCRATCH/candidate-permissions.json" \
                    > "$SCRATCH/candidate-permissions.next.json"
                  mv "$SCRATCH/candidate-permissions.next.json" "$SCRATCH/candidate-permissions.json"
                done <<< "$CANDIDATES"
                set +e
                ACTOR=$(uv run python -m scripts.marketplace_ci resolve-attested-actor \
                  --comments-with-login "$SCRATCH/comments-with-login.json" --head-sha "$HEAD_SHA" \
                  --permissions "$SCRATCH/candidate-permissions.json")
                actor_exit=$?
                set -e
                if [ "$actor_exit" -eq 2 ]; then
                  echo "::error::resolve-attested-actor exited 2 (infrastructure/configuration failure, not a normal no-match) -- see stderr above. Refusing to silently report bypassed=false for this."
                  exit 1
                fi
                if [ -z "$ACTOR" ]; then
                  echo "bypassed=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
                # Same multi-page-concatenation gap as above -- jq --slurpfile
                # doesn't fail on it (unlike json.loads), it silently succeeds
                # with $comments as an array of per-page arrays, so
                # $comments[0] below would silently drop every page after the
                # first. Merge pages the same way before writing this file.
                # Only the resolved actor's own comments count, same as the
                # label path below (a forged marker from another author must
                # never supply the attestation metadata).
                gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                  | jq -s --arg actor "$ACTOR" '[.[] | .[] | select((.user.login // "") == $actor) | .body]' \
                  > "$SCRATCH/comment-bodies.json"
                jq -n --arg actor "$ACTOR" --arg sha "$HEAD_SHA" --arg permission "$PERMISSION" \
                  --slurpfile comments "$SCRATCH/comment-bodies.json" \
                  '{actor: $actor, head_sha: $sha, permission: $permission, comments: $comments[0]}' \
                  > "$SCRATCH/bypass-event.json"
                # Same exit-code distinction as resolve-attested-actor above:
                # check-bypass's own contract is exit 0 (ALLOWED), exit 1
                # (DENIED -- legitimate), exit 2 (infra/config failure, e.g.
                # an unreadable event file or missing field).
                set +e
                uv run python -m scripts.marketplace_ci check-bypass --event "$SCRATCH/bypass-event.json"
                bypass_exit=$?
                set -e
                if [ "$bypass_exit" -eq 2 ]; then
                  echo "::error::check-bypass exited 2 (infrastructure/configuration failure, not a normal denial) -- see stderr above. Refusing to silently report bypassed=false for this."
                  exit 1
                elif [ "$bypass_exit" -eq 0 ]; then
                  echo "::warning::Codex review bypassed via CODEX_CI_REVIEW_BYPASS variable + SHA-bound attestation from @$ACTOR (no bypass label applied to this PR)."
                  echo "bypassed=true" >> "$GITHUB_OUTPUT"
                else
                  echo "bypassed=false" >> "$GITHUB_OUTPUT"
                fi
                exit 0
                ;;
              *)
                echo "::error::Unrecognized CODEX_CI_REVIEW_BYPASS variable value: '$CODEX_CI_REVIEW_BYPASS' (expected 0 or 1)"
                exit 1
                ;;
            esac
          fi
          LABELS=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]')
          if ! echo "$LABELS" | jq -e 'index("s: codex review bypassed")' > /dev/null; then
            echo "bypassed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The actor is whoever actually applied the bypass label -- never
          # the PR's original author, who may be a different, less-privileged
          # person than whoever is attesting the bypass. Resolve via the
          # issue events timeline (most recent matching "labeled" event).
          # Same multi-page-concatenation gap the CODEX_CI_REVIEW_BYPASS
          # path above documents: --jq applied inline on --paginate only
          # transforms each page independently, and reading $(...) output
          # directly (no JSON parser here at all) would otherwise capture
          # every page's own separate result on its own line, corrupting
          # $ACTOR into a multi-line value on an events response spanning
          # more than one page. Merge pages first via `jq -s`.
          ACTOR=$(gh api "repos/$REPO/issues/$PR_NUMBER/events" --paginate \
            | jq -s -r '[.[] | .[] | select(.event == "labeled" and .label.name == "s: codex review bypassed")] | last | .actor.login')
          if [ -z "$ACTOR" ] || [ "$ACTOR" = "null" ]; then
            echo "bypassed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same shape check the variable path applies to each candidate: the
          # login goes into a URL path below, so anything outside a plain
          # GitHub user login (a "[bot]" suffix included, which check-bypass
          # rejects anyway) is treated as no bypass.
          case "$ACTOR" in
            *[!A-Za-z0-9-]*)
              echo "bypassed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          # Same $comments[0]-truncation gap as the variable path above --
          # merge pages before writing this file. Keep only comments whose
          # REAL author (.user.login) is the labeler: check-bypass matches
          # the marker's self-declared "actor" against $ACTOR, so without
          # this filter anyone able to comment could forge a marker naming a
          # privileged labeler for a later head SHA while the label from an
          # earlier attestation still persists (security-reviewer finding).
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            | jq -s --arg actor "$ACTOR" '[.[] | .[] | select((.user.login // "") == $actor) | .body]' \
            > "$SCRATCH/comment-bodies.json"
          jq -n --arg actor "$ACTOR" --arg sha "$HEAD_SHA" --arg permission "$PERMISSION" \
            --slurpfile comments "$SCRATCH/comment-bodies.json" \
            '{actor: $actor, head_sha: $sha, permission: $permission, comments: $comments[0]}' \
            > "$SCRATCH/bypass-event.json"
          # Same exit-code distinction as the variable path above.
          set +e
          uv run python -m scripts.marketplace_ci check-bypass --event "$SCRATCH/bypass-event.json"
          bypass_exit=$?
          set -e
          if [ "$bypass_exit" -eq 2 ]; then
            echo "::error::check-bypass exited 2 (infrastructure/configuration failure, not a normal denial) -- see stderr above. Refusing to silently report bypassed=false for this."
            exit 1
          elif [ "$bypass_exit" -eq 0 ]; then
            echo "bypassed=true" >> "$GITHUB_OUTPUT"
          else
            echo "bypassed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine final policy result
        env:
          BYPASSED: ${{ steps.bypass.outputs.bypassed }}
          SCOPE_RESULT: ${{ needs.compute-scope.result }}
          BYPASS_ELIGIBLE: ${{ needs.compute-scope.outputs.bypass_eligible }}
          CODEX_RESULT: ${{ needs.codex-review.result }}
          PREFIX_PERMANENCE_RESULT: ${{ needs.prefix-permanence.result }}
        run: |
          # Checked before the BYPASSED short-circuit below, deliberately:
          # prefix-permanence is a deterministic, mechanical gate, not the
          # (expensive, rate-limited) Codex review the bypass label/variable
          # exists to skip -- same "deterministic ... gates still apply
          # unchanged" principle the BYPASSED message below already states.
          if [ "$PREFIX_PERMANENCE_RESULT" != "success" ]; then
            echo "prefix-permanence did not succeed (result: $PREFIX_PERMANENCE_RESULT) -- failing closed."
            exit 1
          fi
          if [ "$BYPASSED" = "true" ]; then
            echo "Codex review bypassed (attested SHA-bound label exception or CODEX_CI_REVIEW_BYPASS variable). Never presented as a clean review — deterministic, PR-author-privilege, and branch-protection gates still apply unchanged."
            exit 0
          fi
          # compute-scope must have actually succeeded before its
          # bypass_eligible output (and, transitively, codex-review's own
          # 'skipped' result) can be trusted -- a failed/cancelled/timed-out
          # compute-scope must never read as a legitimate bypass.
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "compute-scope did not succeed (result: $SCOPE_RESULT) -- cannot verify the automatic reviewer-scope bypass, failing closed."
            exit 1
          fi
          # A 'skipped' codex-review is only legitimate when compute-scope
          # itself said so. Enumerating codex-review's OTHER needs (hygiene,
          # python-quality, marketplace-parity) one at a time was the gap a
          # security review found: any of those failing also makes
          # codex-review 'skipped' as an unrelated side effect, which the
          # old check here would have silently accepted as a clean pass.
          # Keying off compute-scope's own explicit output instead of
          # codex-review's bare result closes every such path at once,
          # regardless of which upstream job actually caused the skip.
          if [ "$CODEX_RESULT" = "skipped" ] && [ "$BYPASS_ELIGIBLE" != "true" ]; then
            echo "codex-review was skipped for a reason other than an approved reviewer-scope bypass (bypass_eligible=$BYPASS_ELIGIBLE) -- failing closed."
            exit 1
          fi
          if [ "$CODEX_RESULT" != "success" ] && [ "$CODEX_RESULT" != "skipped" ]; then
            echo "Codex review job failed, timed out, or found a blocking (Critical/Major) finding."
            exit 1
          fi
          echo "Codex review passed (codex-review=$CODEX_RESULT, bypass_eligible=$BYPASS_ELIGIBLE)."

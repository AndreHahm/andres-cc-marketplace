name: Merge Conflict Labeler
on:
  # So that PRs touching the same files as the push are updated
  push:
  # So that the `dirtyLabel` is removed if conflicts are resolved
  # We recommend `pull_request_target` so that github secrets are available.
  # In `pull_request` we wouldn't be able to change labels of fork PRs
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: check if prs are dirty
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # ratchet:eps1lon/actions-label-merge-conflict@v3.1.0
        with:
          dirtyLabel: "s: merge conflict"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: "This pull request has conflicts, please resolve those before we can evaluate the pull request."

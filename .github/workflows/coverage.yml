name: Coverage

# Measures test coverage, uploads it to Codecov, and on a pull request computes quality-kit's coverage
# tier from patch coverage (docs/ci.md, "Coverage"). None of its three jobs is a required check. A separate
# workflow from marketplace-ci.yml because that one runs on pull_request only, so main would get no
# Codecov baseline.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (pytest-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Restore kill-switch enforcement from the trusted base SHA (trust boundary)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Same restore-from-base pattern as validate-marketplace.yml: the PR's own copy of the
          # enforcement action is untrusted, so the base SHA's copy is used.
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then
                rm -f "$path"
              fi
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          restore_from_base .github/actions/workflow-killswitch/action.yml keep
          restore_from_base .github/actions/track-rerun/action.yml keep
          restore_from_base .github/WORKFLOW_KILLSWITCH remove
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}
      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # ratchet:astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: "false"
          python-version: "3.13"
      - run: uv sync --locked --group dev --no-build --no-install-package csscompressor --no-install-package jsmin
      # Sources, data file and patch = subprocess come from [tool.coverage.*] in pyproject.toml.
      # Wall-clock tests are left out: tracing slows the code past their bounds. Python quality runs them.
      - run: >-
          uv run --no-sync --no-build pytest -q -n auto --cov -m "not timing"
          --cov-report=xml:.temp/coverage/coverage.xml
          --cov-report=json:.temp/coverage/coverage.json
      - name: Keep the reports for the tier job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: coverage-reports
          path: |
            .temp/coverage/coverage.xml
            .temp/coverage/coverage.json
          retention-days: 7
          if-no-files-found: error

  # The upload runs in its own job, so the PR's test code never runs where CODECOV_TOKEN is. The
  # checkout is only read (Codecov maps report paths to repository files); nothing in it is run.
  codecov-upload:
    name: Codecov upload
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: coverage-reports
          path: ${{ runner.temp }}/coverage
      # An upload failure never fails this job: Codecov is a view, not a gate.
      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # ratchet:codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/coverage/coverage.xml
          disable_search: true
          disable_telem: true
          # No upload plugins: they would run tools inside the PR's checkout in the job with the token.
          plugins: noop
          fail_ci_if_error: false
          # The CLI goes to a temporary directory, never the checkout, where a PR could plant a file
          # of the same name that runs with the token if the download fails.
          cleanup: true

  coverage-tier:
    name: Coverage tier
    if: github.event_name == 'pull_request'
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The default pull_request checkout is the merge commit, the same commit the coverage job
      # measured; HEAD^1 is the base it was merged onto. Everything this job trusts or writes lives
      # under $RUNNER_TEMP, outside that checkout: a PR can commit any file into the workspace
      # (a planted module, a symlink, a fake override or notes file), but not into $RUNNER_TEMP.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the tier script and thresholds from the base SHA (a PR must not lower its own bar)
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/trusted"
          mkdir -p "$trusted"
          : > "$trusted/notes.txt"
          # Returns 1 only on a 404 (the file is not on the base branch). Any other failure, a bad
          # decode included, ends the step with `exit 1`, even where the call sits in an `if`.
          fetch() {
            local path="$1" target="$2"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              rm -f "$stderr_file"
              if ! printf '%s\n' "$content" | base64 -d > "$target"; then
                echo "::error::could not decode $path at the base SHA"
                exit 1
              fi
              return 0
            elif grep -q "HTTP 404" "$stderr_file"; then
              rm -f "$stderr_file"
              return 1
            fi
            echo "::error::could not read $path at the base SHA ($(cat "$stderr_file"))"
            rm -f "$stderr_file"
            exit 1
          }
          # Fall back to the PR's own copies only when the base has neither file. A base with just one
          # of them fails closed, so the PR's copy never replaces a trusted one.
          have=0
          if fetch plugins/quality-kit/scripts/qlty-coverage-tier.py "$trusted/tier.py"; then have=$((have + 1)); fi
          if fetch plugins/quality-kit/assets/qlty-coverage-tiers.yml "$trusted/defaults.yml"; then have=$((have + 1)); fi
          if [ "$have" -eq 1 ]; then
            echo "::error::the base branch has only one of the tier script and its defaults; refusing to mix in the PR's copy"
            exit 1
          fi
          if [ "$have" -eq 0 ]; then
            cp plugins/quality-kit/scripts/qlty-coverage-tier.py "$trusted/tier.py"
            cp plugins/quality-kit/assets/qlty-coverage-tiers.yml "$trusted/defaults.yml"
            echo "The tier script is not on the base branch yet, so this PR's own copy computed the tier, and the PR comment is skipped." >> "$trusted/notes.txt"
            # The PR's own code runs in this job, so no later step may hold a write token.
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi
          # The tier script's hash-pinned dependencies: the base copy, or the PR's own copy only when the
          # PR's own script runs anyway. Absent from a base that predates the file, so the next step then
          # keeps its unhashed pins.
          rm -f "$trusted/requirements.txt"
          if ! fetch plugins/quality-kit/assets/qlty-coverage-tier-requirements.txt "$trusted/requirements.txt"; then
            if [ "$have" -eq 0 ]; then
              cp plugins/quality-kit/assets/qlty-coverage-tier-requirements.txt "$trusted/requirements.txt"
            fi
          fi
          # The repository override: the base copy, or none. The PR's own copy is never used.
          rm -f "$trusted/override.yml"
          if ! fetch .github/coverage-tiers.yml "$trusted/override.yml"; then
            : # a 404: no override on the base branch, so the default thresholds apply
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: coverage-reports
          path: ${{ runner.temp }}/coverage
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # ratchet:astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: "false"
          python-version: "3.13"
      # No token in this step's environment: it runs PR-controlled input through the script. -I keeps
      # the workspace off sys.path and --no-config ignores a uv.toml the PR may add.
      - name: Compute the tier
        id: tier
        run: |
          # +e: the runner's default bash adds -e, which would end the step on an orange or red
          # exit before its code is read and the comment and summary are written.
          set +e -uo pipefail
          trusted="$RUNNER_TEMP/trusted"
          out="$RUNNER_TEMP/coverage"
          # Plain text diff whatever .gitattributes the PR adds (no external diff, no textconv,
          # binary attributes ignored), with fixed prefixes and unquoted non-ASCII paths.
          git -c core.quotePath=false diff --no-ext-diff --no-textconv --text \
            --src-prefix=a/ --dst-prefix=b/ --unified=0 HEAD^1 HEAD > "$out/patch.diff" \
            || { echo "::error::could not build the PR diff"; exit 1; }
          # Hashes are checked only by `uv pip install --require-hashes`: `uv run --with-requirements`
          # installs a package whose hash does not match (checked 2026-11-18, uv 0.12.21).
          if [ -f "$trusted/requirements.txt" ]; then
            venv="$RUNNER_TEMP/tier-venv"
            { uv venv --no-config --quiet --python 3.13 "$venv" \
              && uv pip install --no-config --quiet --python "$venv/bin/python" --require-hashes --no-build \
                -r "$trusted/requirements.txt"; } \
              || { echo "::error::could not install the tier script's hash-pinned dependencies"; exit 1; }
            tier_python=("$venv/bin/python")
          else
            tier_python=(uv run --no-project --no-config --with "pyyaml==6.0.3" --with "defusedxml==0.7.1" python)
          fi
          run_tier() {
            "${tier_python[@]}" -I "$trusted/tier.py" \
              --coverage "$out/coverage.json" --diff "$out/patch.diff" \
              --defaults "$trusted/defaults.yml" --override "$trusted/override.yml" "$@"
          }
          run_tier --github-annotations
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -le 1 ]; then
            { run_tier --format markdown; cat "$trusted/notes.txt"; } > "$out/comment.md"
            cat "$out/comment.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      # A fork PR's token is read-only, so the comment is skipped there; the tier is in the job summary.
      # Skipped too when the PR's own tier script ran: it could have changed PATH for this step.
      - name: Post or update the tier comment
        if: (steps.tier.outputs.code == '0' || steps.tier.outputs.code == '1') && steps.restore.outputs.fallback != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPO" != "true" ]; then
            echo "Fork PR: comment skipped; see the job summary."
            exit 0
          fi
          # A re-run of an older run keeps its old head SHA: never let it replace a newer result.
          current=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"')
          if [ "$current" != "open $EVENT_HEAD_SHA" ]; then
            echo "The PR is closed or has a newer head: comment skipped."
            exit 0
          fi
          marker='<!-- quality-kit:coverage-tier -->'
          # All matching ids, then the first, in the shell: piping gh into head could SIGPIPE gh under pipefail.
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          existing=${ids%%$'\n'*}
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/coverage/comment.md" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/coverage/comment.md" > /dev/null
          fi
      - name: Fail on an orange or red tier, or a tier that could not be computed
        env:
          CODE: ${{ steps.tier.outputs.code }}
        run: |
          case "$CODE" in
            0) exit 0 ;;
            1) echo "Coverage tier is orange or red (see the comment or summary)."; exit 1 ;;
            *) echo "::error::the tier script exited $CODE (invalid input, or PyYAML or defusedxml missing)"; exit 1 ;;
          esac

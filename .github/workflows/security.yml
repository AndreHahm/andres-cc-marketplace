# ─── Security — Secret scan · npm audit · CodeQL ─────────────────────────────
# Runs on every push/PR to main and on a weekly schedule.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 4 * * 1" # weekly on Monday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretlint:
    name: "Run secretlint on changed files"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Without this, checkout persists GITHUB_TOKEN in .git/config,
          # readable by every PR-controlled step that runs afterward
          # (setup-pnpm, pnpm install) -- the kill-switch checkout above
          # already sets this; this step didn't (zizmor artipacked +
          # CodeRabbit finding, PR #294 review).
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # ratchet:tj-actions/changed-files@v47.0.6
        with:
          # Double-quoted so YAML actually escapes this to a real newline --
          # single-quoted '\n' is the literal two-character string backslash+n
          # (YAML single-quoted scalars never process escapes), and this
          # action does a raw `Array.join(separator)` with no unescaping of
          # its own, so a single-quoted value here would silently join
          # filenames with a literal "\n" instead of a real newline, breaking
          # the `xargs -d '\n'` step below it feeds (verified against the
          # action's own v47.0.6 dist/index.js).
          separator: "\n"

      - name: Set up Node.js
        uses: ./.github/actions/setup-pnpm
        with:
          # skip-install: this job never installs the repo's own root
          # package.json -- it only ever installs the isolated
          # .github/security-tools/ toolchain below, gated on any_changed.
          skip-install: 'true'

      - name: Show changed files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: printf '%s\n' "$CHANGED_FILES"

      - name: Restore security-tools manifest from the trusted base SHA (trust boundary)
        # secretlint's own manifest+lockfile live in an isolated directory
        # (.github/security-tools/), decoupled from the repo's root
        # package.json/pnpm-lock.yaml, specifically so this restore can be
        # unconditional: `pnpm install --frozen-lockfile` only verifies
        # that a manifest and its lockfile agree with EACH OTHER, not that
        # either matches trusted content -- a PR that edited both files
        # consistently in the repo root could otherwise swap in a forged
        # "secretlint" package that still passes --frozen-lockfile
        # (CodeRabbit finding, PR #294 review). Restoring the isolated
        # manifest from base closes that gap without conflicting with any
        # *legitimate* root package.json change this PR might also make,
        # since this scan's own toolchain no longer shares a manifest with
        # the rest of the repo.
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          restore_from_base() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              # Genuinely absent at the trusted base -- this is the
              # bootstrapping PR introducing this isolated toolchain for the
              # first time, so no trusted base copy exists yet to restore;
              # keep the PR's own (this workflow's own commit history).
              :
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          restore_from_base .github/security-tools/package.json
          restore_from_base .github/security-tools/pnpm-lock.yaml

      - name: Install secretlint (isolated toolchain)
        if: steps.changed-files.outputs.any_changed == 'true'
        # --ignore-scripts: without it, pnpm would execute the isolated
        # manifest's own preinstall/postinstall/prepare scripts (none are
        # declared today, but this stays defense-in-depth against a future
        # trusted-base change adding one) before "Run secretlint" invokes
        # the resulting binary.
        run: pnpm --dir .github/security-tools install --frozen-lockfile --ignore-scripts
        timeout-minutes: 3

      - name: Restore secretlint config from the trusted base SHA (trust boundary)
        # Deliberately placed immediately before the scan itself, not right
        # after checkout: setup-pnpm (a local composite action, itself
        # PR-controlled) and `pnpm install` (which runs the PR's own
        # package.json lifecycle scripts) both execute PR-controlled code
        # after an earlier restore attempt and before the scan -- either
        # could silently re-corrupt an already-restored file. Restoring here,
        # with no further PR-controlled execution before "Run secretlint"
        # below, is what actually closes the gap (Codex's own review caught
        # the ordering flaw in an earlier version of this same fix).
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # .secretlintrc.json/.secretlintignore are PR-controlled at this
          # point (this job's checkout has no ref override, so pull_request
          # runs against the PR's own merge-commit content) -- a PR could
          # weaken its own secret scan (e.g. add a leaking path to
          # .secretlintignore) and this check would still report success.
          # Restore both from the trusted base SHA before secretlint ever
          # reads them (same restore-from-base pattern marketplace-ci.yml's
          # Hygiene job already uses).
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then
                rm -f "$path"
              fi
              # else "keep": this is the bootstrapping PR introducing $path
              # for the first time -- no trusted base copy exists yet to
              # restore, so the PR's own checkout content stays.
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          restore_from_base .secretlintrc.json keep
          restore_from_base .secretlintignore keep

      - name: Run secretlint
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          printf '%s' "$CHANGED_FILES" > /tmp/changed-files.txt
          # secretlint is a pinned devDependency of the isolated
          # .github/security-tools/ toolchain (restored from trusted base,
          # installed above). Invoked by its own binary path, not `pnpm
          # --dir .github/security-tools exec` -- that form changes the
          # child process's own cwd to .github/security-tools/ (verified
          # locally), which would break every changed-file path below
          # (repo-root-relative, e.g. ".github/workflows/security.yml")
          # since they'd then resolve relative to the wrong directory.
          # Invoking the binary directly keeps cwd at the repo root, where
          # $CHANGED_FILES's own paths are already correct.
          #
          # The `--` after `-d '\n'` only terminates xargs's own option
          # parsing -- it is not forwarded to secretlint. Without a second
          # `--` for secretlint's own argv, a changed file named e.g.
          # "--help" would be parsed by secretlint as an option flag
          # instead of a filename, printing help and exiting 0 without
          # scanning anything.
          xargs -a /tmp/changed-files.txt -d '\n' -- ./.github/security-tools/node_modules/.bin/secretlint --

# ─── Security — Secret scan · npm audit · CodeQL ─────────────────────────────
# Runs on every push/PR to main and on a weekly schedule.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 4 * * 1" # weekly on Monday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretlint:
    name: "Run secretlint on changed files"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-killswitch
            .github/actions/track-rerun
      - name: Check Workflow Kill Switch
        uses: ./.github/actions/workflow-killswitch
        with:
          killswitch-var: ${{ vars.WORKFLOW_KILLSWITCH }}

      - name: Track workflow rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/track-rerun

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # ratchet:tj-actions/changed-files@v47.0.6
        with:
          # Double-quoted so YAML actually escapes this to a real newline --
          # single-quoted '\n' is the literal two-character string backslash+n
          # (YAML single-quoted scalars never process escapes), and this
          # action does a raw `Array.join(separator)` with no unescaping of
          # its own, so a single-quoted value here would silently join
          # filenames with a literal "\n" instead of a real newline, breaking
          # the `xargs -d '\n'` step below it feeds (verified against the
          # action's own v47.0.6 dist/index.js).
          separator: "\n"

      - name: Set up Node.js
        uses: ./.github/actions/setup-pnpm
        with:
          # skip-install: this job only wants to install when relevant files
          # actually changed (its own separate "Install dependencies" step
          # below, gated on any_changed) -- the action's own default would
          # otherwise install unconditionally on every run.
          skip-install: 'true'

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        # --ignore-scripts: this install runs in the PR's own checkout, so
        # without it pnpm would also execute the PR's own package.json
        # preinstall/postinstall/prepare scripts, which could tamper with
        # the secretlint binary itself (in node_modules/.bin) before "Run
        # secretlint" invokes it -- restoring the config alone doesn't
        # close that gap (found by cross-model review).
        run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 3

      - name: Show changed files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: printf '%s\n' "$CHANGED_FILES"

      - name: Restore secretlint config from the trusted base SHA (trust boundary)
        # Deliberately placed immediately before the scan itself, not right
        # after checkout: setup-pnpm (a local composite action, itself
        # PR-controlled) and `pnpm install` (which runs the PR's own
        # package.json lifecycle scripts) both execute PR-controlled code
        # after an earlier restore attempt and before the scan -- either
        # could silently re-corrupt an already-restored file. Restoring here,
        # with no further PR-controlled execution before "Run secretlint"
        # below, is what actually closes the gap (Codex's own review caught
        # the ordering flaw in an earlier version of this same fix).
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # .secretlintrc.json/.secretlintignore are PR-controlled at this
          # point (this job's checkout has no ref override, so pull_request
          # runs against the PR's own merge-commit content) -- a PR could
          # weaken its own secret scan (e.g. add a leaking path to
          # .secretlintignore) and this check would still report success.
          # Restore both from the trusted base SHA before secretlint ever
          # reads them (same restore-from-base pattern marketplace-ci.yml's
          # Hygiene job already uses).
          restore_from_base() {
            local path="$1" on_absent="$2"
            mkdir -p "$(dirname "$path")"
            stderr_file=$(mktemp)
            if content=$(gh api --method GET "repos/$REPO/contents/$path" -f ref="$BASE_SHA" --jq '.content' 2>"$stderr_file"); then
              echo "$content" | base64 -d > "$path"
            elif grep -q "HTTP 404" "$stderr_file"; then
              if [ "$on_absent" = "remove" ]; then
                rm -f "$path"
              fi
              # else "keep": this is the bootstrapping PR introducing $path
              # for the first time -- no trusted base copy exists yet to
              # restore, so the PR's own checkout content stays.
            else
              echo "::error::could not verify trusted base-SHA content of $path ($(cat "$stderr_file")) -- refusing to trust the PR's own copy"
              rm -f "$stderr_file"
              exit 1
            fi
            rm -f "$stderr_file"
          }
          restore_from_base .secretlintrc.json keep
          restore_from_base .secretlintignore keep

      - name: Run secretlint
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          printf '%s' "$CHANGED_FILES" > /tmp/changed-files.txt
          # secretlint is a pinned devDependency (package.json/pnpm-lock.yaml)
          # installed by the step above -- `pnpm exec` runs that exact,
          # locked binary rather than `npx`'s unpinned, network-fetched
          # resolution (secretlint wasn't previously declared as a
          # dependency at all, so `npx secretlint` had nothing local to
          # run against; found by cross-model review).
          #
          # The `--` after `-d '\n'` only terminates xargs's own option
          # parsing -- it is not forwarded to secretlint. Without a second
          # `--` for secretlint's own argv, a changed file named e.g.
          # "--help" would be parsed by secretlint as an option flag
          # instead of a filename, printing help and exiting 0 without
          # scanning anything.
          xargs -a /tmp/changed-files.txt -d '\n' -- pnpm exec secretlint --

# These settings are synced to GitHub by https://probot.github.io/apps/settings

repository:
  # See https://docs.github.com/en/rest/reference/repos#update-a-repository for all available settings.

  # Either `true` to make the repository private, or `false` to make it public.
  private: false

  # Either `true` to enable issues for this repository, `false` to disable them.
  has_issues: true

  # Either `true` to enable projects for this repository, or `false` to disable them.
  # If projects are disabled for the organization, passing `true` will cause an API error.
  has_projects: false

  # Either `true` to enable the wiki for this repository, `false` to disable it.
  has_wiki: false

  # Updates the default branch for this repository.
  default_branch: main

  # Either `true` to allow squash-merging pull requests, or `false` to prevent squash-merging.
  allow_squash_merge: true

  # Either `true` to allow merging pull requests with a merge commit, or `false` to prevent merging pull requests with merge commits.
  allow_merge_commit: true

  # Either `true` to allow rebase-merging pull requests, or `false` to prevent rebase-merging.
  allow_rebase_merge: true

  # Either `true` to enable automatic deletion of branches on merge, or `false` to disable
  delete_branch_on_merge: true

  # Whenever there are new changes available in the base branch, present an “update branch” option in the pull request.
  allow_update_branch: true

  # Either `true` to enable automated security fixes, or `false` to disable automated security fixes.
  enable_automated_security_fixes: true

  # Either `true` to enable vulnerability alerts, or `false` to disable vulnerability alerts.
  enable_vulnerability_alerts: true

# Labels: managed by .github/labels.yml + sync-labels.yml, not here -- a labels: block
# in this file would fight that taxonomy (plain names vs. the i:/t:/a:/s: prefixed set).

# Note: `permission` is only valid on organization-owned repositories.
# The permission to grant the collaborator. Can be one of:
# * `pull` - can pull, but not push to or administer this repository.
# * `push` - can pull and push, but not administer this repository.
# * `admin` - can pull, push and administer this repository.
# * `maintain` - Recommended for project managers who need to manage the repository without access to sensitive or destructive actions.
# * `triage` - Recommended for contributors who need to proactively manage issues and pull requests without write access.

# Collaborators: give specific users access to this repository.
# See https://docs.github.com/en/rest/reference/repos#add-a-repository-collaborator for available options
# collaborators:
  # - username: rogerluan
  #   permission: push

# See https://docs.github.com/en/rest/reference/teams#add-or-update-team-repository-permissions for available options
# teams:
#   - name: core
    # The permission to grant the team. Can be one of:
    # * `pull` - can pull, but not push to or administer this repository.
    # * `push` - can pull and push, but not administer this repository.
    # * `admin` - can pull, push and administer this repository.
    # * `maintain` - Recommended for project managers who need to manage the repository without access to sensitive or destructive actions.
    # * `triage` - Recommended for contributors who need to proactively manage issues and pull requests without write access.
  #   permission: admin
  # - name: docs
  #   permission: push

branches:
  - name: main
    # https://docs.github.com/en/rest/reference/repos#update-branch-protection
    # Branch Protection settings. Set to null to disable
    protection:
      # Required. Require at least one approving review on a pull request, before merging. Set to null to disable.
      # NOTE: disabled for now. This repository currently has a single collaborator (the owner,
      # per CODEOWNERS), and GitHub does not allow a PR author to approve their own pull request --
      # requiring review here (with enforce_admins: true removing the admin-override escape hatch)
      # would make main permanently unmergeable through the normal PR flow. Re-enable once a second
      # real collaborator/CODEOWNER exists.
      required_pull_request_reviews: null
      # Required. Require status checks to pass before merging. Set to null to disable
      required_status_checks:
        # Required. Require branches to be up to date before merging.
        strict: true
        # Required. The list of status checks to require in order to merge into this branch.
        checks:
          - context: Hygiene (PR contract)
          - context: Python quality (ruff, ty, pytest)
          - context: Marketplace mirror/export parity
          - context: Fork PR (unsupported — explicit terminal result)
          - context: Publish Codex policy result
          - context: Validate Repository Structure
          - context: Validate Marketplace Plugin Entries
          - context: Validate Individual Plugins
          - context: Check for Duplicate Plugin Names
      # Required. Enforce all configured restrictions for administrators. Set to true to enforce required status checks for repository administrators. Set to null to disable.
      enforce_admins: true
      # Prevent merge commits from being pushed to matching branches
      required_linear_history: true
      # Permits force pushes to the protected branch by anyone with write access to the repository
      allow_force_pushes: false
      # Allows deletion of the protected branch by anyone with write access to the repository.
      allow_deletions: false
      # Required. Restrict who can push to this branch. Team and user restrictions are only available for organization-owned repositories. Set to null to disable.
      restrictions: null

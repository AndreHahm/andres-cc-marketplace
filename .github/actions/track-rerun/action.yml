name: Track Workflow Rerun
description: Track when GitHub Actions workflows are rerun (attempt > 1)

runs:
  using: composite
  steps:
    # Eventually we can start logging this to monitor codebase health (e.g. to Slack, PostHog, etc.)
    - name: Track workflow rerun
      if: github.run_attempt > 1
      shell: bash
      env:
        # github.workflow resolves to this workflow file's own `name:` field --
        # on a pull_request (not pull_request_target) trigger, that field comes
        # from the PR's own branch, so a same-repo PR can set it to arbitrary
        # attacker-controlled text. Interpolating it (or any other ${{ }}
        # expression) directly into run: source is GitHub Actions script
        # injection: the substitution happens before the shell ever parses the
        # script, so quoting it in the YAML doesn't make the value shell-safe.
        # Route every dynamic value through env: and reference it as a quoted
        # shell variable instead (Codex cross-model-review finding).
        RUN_ATTEMPT: ${{ github.run_attempt }}
        WORKFLOW_NAME: ${{ github.workflow }}
        PR_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
        COMMIT_SHA: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
      run: |
        # A workflow's name: field can itself contain embedded CR/LF (YAML
        # allows a multi-line scalar there), which would let an attacker-
        # controlled WORKFLOW_NAME forge a separate ::error::/::warning:: log
        # line once echoed into the ::notice:: line below -- GitHub's own
        # workflow-command parser scans stdout per physical line, not per
        # echo call. Stripping CR/LF first closes that (Codex cross-model-
        # review finding); this cannot flip a real pass/fail result either
        # way, since that comes from step exit codes, not log annotations.
        WORKFLOW_NAME="${WORKFLOW_NAME//[$'\r\n']/}"
        echo "🔄 Workflow rerun detected - Attempt #$RUN_ATTEMPT"
        echo "📊 Workflow: $WORKFLOW_NAME"
        echo "🔀 PR: $PR_NUMBER"
        echo "📝 Commit: $COMMIT_SHA"
        echo "👤 Actor: $ACTOR"
        echo "⏰ Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo ""
        echo "::notice title=Workflow Rerun Detected::This is attempt #$RUN_ATTEMPT of workflow '$WORKFLOW_NAME'"

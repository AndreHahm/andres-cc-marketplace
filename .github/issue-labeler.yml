# ---------------------------------------------------------------------------
# Content-regex label rules for github/issue-labeler, wired up by
# .github/workflows/issue-auto-label.yml. Direct issue-equivalent of
# .github/labeler.yml (actions/labeler) on the PR side -- but since issues
# have no diff/changed-files to match against, rules here match issue
# title+body content instead of file paths.
#
# Format: label -> list of regexes (github/issue-labeler requires ALL entries
# in a label's list to match -- not "any of" -- so each label below uses a
# single regex with internal alternation). Use the '/pattern/flags' form for
# case-insensitive matching; a bare pattern (no slashes) is matched
# case-sensitively via a plain String.match.
#
# Labels must match the names defined in .github/labels.yml. Scoped to the
# `a:` area labels only -- `t:`/`p:` type/priority labels are the separate
# keyword-pattern step in issue-opened-labeler.yml's job. Kept deliberately
# non-overlapping so the two mechanisms never fight over the same label
# (see issue-opened-labeler.yml's own comment on this split).
# ---------------------------------------------------------------------------

"a: github-actions":
  # A dot-prefixed alternative (.github/workflows, .github/actions) can't sit
  # inside the same leading \b(...)  as the word-based alternatives -- '.' is
  # a non-word char, so \b never matches at the whitespace/punctuation
  # boundary that precedes it in real prose (cross-model-review finding,
  # verified live: the old \b(...|\\.github\/workflows|...)\b form tested
  # false against "The .github/workflows file fails"). Trailing \b is kept
  # here since both dotted alternatives end in a word char (s). The `s?` on
  # the word-based alternatives (also PR #324 review, CodeRabbit + Codex,
  # both independently) covers the plural forms ("GitHub Actions",
  # "workflow files") a bare trailing \b otherwise blocks the same way.
  # `ci workflows?|github workflows?` added per PR #324 round-2 review
  # (Codex): "CI workflow fails" / "GitHub workflow is broken" are common
  # phrasings docs/github-label-taxonomy.md's own "workflows generally"
  # scope covers, verified false with the prior pattern. Deliberately
  # qualified (not a bare "workflow") to avoid matching an unrelated
  # workflow mention (e.g. "improve the review workflow").
  - '/(?:\b(?:github actions?|workflow files?|ci workflows?|github workflows?)\b|\.github\/(?:workflows|actions)\b)/i'

"a: ai-setup":
  # Same fix as "a: github-actions" above for the .claude/ alternative --
  # additionally drops the trailing \b too, since .claude/ ends in "/" (also
  # non-word), which would keep blocking a match whenever followed by
  # whitespace/punctuation instead of a word character. `s?` on
  # "subagent"/"marketplace plugin" for the same plural-boundary reason as
  # "a: github-actions" above.
  - '/(?:\b(?:claude code|plugin-devkit|marketplace plugins?|skill\.md|subagents?)\b|\.claude\/)/i'

"a: dependencies":
  - '/\b(dependenc(y|ies)|package\.json|pyproject\.toml|uv\.lock|pnpm-lock|npm install|pip install)\b/i'

"a: tests":
  # `s?` on all three phrases -- "unit tests", "test suites", "failing
  # tests" are at least as common as their singular forms and were silently
  # unmatched before (PR #324 review, Codex). Bare plural `tests` added per
  # PR #324 round-2 review (Codex): "Tests fail on Windows" was still false.
  # Deliberately plural-only, not `tests?` -- singular bare "test" would
  # match feature_request.md's own boilerplate ("I can help test this
  # feature"), the same false-positive class round-1's review fixed
  # elsewhere; Codex's own round-2 finding explicitly verified this
  # asymmetry holds.
  - '/\b(pytest|unit tests?|test suites?|failing tests?|tests)\b/i'

"a: architecture":
  - '/\b(architecture|design decisions?|\bADRs?\b)\b/i'

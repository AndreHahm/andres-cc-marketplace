---
# Codacy config file (docs: https://docs.codacy.com/repositories-configure/codacy-configuration-file/).
# Once this file exists, it becomes the SOLE source of truth for ignored
# files -- any "Ignored files" settings previously configured on Codacy's
# own dashboard for this repo no longer apply once this file is present.
#
# Codacy's config file can only exclude a whole path from a whole engine,
# never a single specific rule while leaving the rest of that path's
# analysis active (verified against Codacy's own docs, issue/PR #299).
# plugins/codex-kit/scripts/smoke-tests/** creates scratch fixtures under
# a fresh mkdtempSync temp directory on every run -- a normal, established
# pattern for this kind of test that several of Codacy's bundled rules
# (non-literal-path-reaches-fs-write, non-literal-RegExp-construction)
# have no way to distinguish from a real, attacker-influenced path, since
# they don't reason about mkdtempSync's own safety guarantees. Excluding
# this path from ALL engines (not just the ones currently firing) is a
# deliberate, disclosed tradeoff -- it also silences secret-detection
# (gitleaks-style) coverage for this directory going forward, accepted
# here since a false-positive-plagued required check blocking every PR
# that adds a new smoke-test scenario is a worse practical outcome than
# losing that one narrow directory's own secret-scan coverage.
#
# .claude/skills|agents|commands|hooks|rules/** are this repo's own generated mirror
# tree -- byte-identical copies of the canonical plugins/*/... source, kept in sync by
# scripts/marketplace_ci (see .claude/marketplace-sync.json's plugin_mirrors and R19's
# "in-development plugin mirror" exception in plugin-rulebook). The canonical
# plugins/*/... copy stays fully scanned; excluding the mirror avoids Codacy re-flagging
# the exact same code a second time under a different path purely because it's new to
# that specific path, not because it's new content -- confirmed live, PR #306: adding a
# plugin to plugin_mirrors for the first time surfaced 15 "new" security findings that
# were really pre-existing, already-accepted findings in the plugin's own canonical
# source, never independently reviewable or fixable at the mirror path in isolation
# (fixing them means editing the canonical plugins/*/... file, which then re-syncs here
# automatically). Same disclosed tradeoff as above: this also silences secret-detection
# for the mirror tree, accepted since the canonical source is never itself excluded.
exclude_paths:
  - "plugins/codex-kit/scripts/smoke-tests/**"
  - ".claude/skills/**"
  - ".claude/agents/**"
  - ".claude/commands/**"
  - ".claude/hooks/**"
  - ".claude/rules/**"

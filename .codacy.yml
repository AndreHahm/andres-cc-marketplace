---
# Codacy config file (docs: https://docs.codacy.com/repositories-configure/codacy-configuration-file/).
# Once this file exists, it becomes the SOLE source of truth for ignored
# files -- any "Ignored files" settings previously configured on Codacy's
# own dashboard for this repo no longer apply once this file is present.
#
# Codacy's config file can only exclude a whole path from a whole engine,
# never a single specific rule while leaving the rest of that path's
# analysis active (verified against Codacy's own docs, issue/PR #299).
# plugins/codex-kit/scripts/smoke-tests/** creates scratch fixtures under
# a fresh mkdtempSync temp directory on every run -- a normal, established
# pattern for this kind of test that several of Codacy's bundled rules
# (non-literal-path-reaches-fs-write, non-literal-RegExp-construction)
# have no way to distinguish from a real, attacker-influenced path, since
# they don't reason about mkdtempSync's own safety guarantees. Excluding
# this path from ALL engines (not just the ones currently firing) is a
# deliberate, disclosed tradeoff -- it also silences secret-detection
# (gitleaks-style) coverage for this directory going forward, accepted
# here since a false-positive-plagued required check blocking every PR
# that adds a new smoke-test scenario is a worse practical outcome than
# losing that one narrow directory's own secret-scan coverage.
# plugins/*/tests/** is every plugin's own pytest suite. Bandit's B101 ("Use of
# assert detected...") fires on every bare `assert` statement, which is the
# actual test mechanism pytest relies on -- these files are never run under
# `python -O` (the only condition B101 warns about), so the rule is a
# structural false positive here, not a real finding, for every test file in
# every plugin, not just one. Verified directly on analysis-kit's two newest
# test files (PR #302): Codacy reported "92 new security issues"; a local
# `bandit -r` run against the exact same two files reproduced 60 findings,
# all B101, 0 of any other rule -- the 92 count is the same 60 real
# assert-statements with roughly half double-reported by Codacy's own
# aggregation, not 92 distinct issues. Same whole-path/whole-engine tradeoff
# as the smoke-tests exclusion below: this also silences secret-detection
# (gitleaks-style) coverage inside tests/**, accepted here for the same
# reason -- a false-positive-plagued required check blocking every PR that
# adds a test function is a worse practical outcome than losing that
# directory's own secret-scan coverage. Test fixtures that intentionally
# embed a secret-shaped string (e.g. to exercise redaction logic) should
# still use an obviously-synthetic placeholder, the same discipline already
# expected repo-wide -- this exclusion is not a reason to relax that.
#
# .github/scripts/test-issue-auto-labeling.js hits the same two rules as the
# smoke-tests exclusion above, for the same underlying reason: it reads
# .github/workflows/issue-opened-labeler.yml and .github/issue-labeler.yml
# via a __dirname-relative path (non-literal-path-reaches-fs-write) and
# builds RegExp objects from the patterns it parses out of them
# (non-literal-RegExp-construction), by design -- extracting the real
# source-of-truth patterns instead of hand-duplicating them is the whole
# point (so this test can't silently drift from what actually ships; see
# the script's own header comment). Verified directly before excluding:
# eval() was removed entirely in favor of new RegExp() (PR #324 review),
# and the one function whose parameter Codacy still flags
# (path.resolve(..., `ISSUE_TEMPLATE/${name}`)) already has an explicit
# runtime allowlist Codacy's static analysis has no way to credit. Same
# disclosed tradeoff as above: excluding the whole file also silences
# secret-detection for it, accepted since it contains no secrets and the
# canonical files it reads are never themselves excluded.
#
# .claude/skills|agents|commands|hooks|rules/** are this repo's own generated mirror
# tree -- byte-identical copies of the canonical plugins/*/... source, kept in sync by
# scripts/marketplace_ci (see .claude/marketplace-sync.json's plugin_mirrors and R19's
# "in-development plugin mirror" exception in plugin-rulebook). The canonical
# plugins/*/... copy stays fully scanned; excluding the mirror avoids Codacy re-flagging
# the exact same code a second time under a different path purely because it's new to
# that specific path, not because it's new content -- confirmed live, PR #306: adding a
# plugin to plugin_mirrors for the first time surfaced 15 "new" security findings that
# were really pre-existing, already-accepted findings in the plugin's own canonical
# source, never independently reviewable or fixable at the mirror path in isolation
# (fixing them means editing the canonical plugins/*/... file, which then re-syncs here
# automatically). Same disclosed tradeoff as above: this also silences secret-detection
# for the mirror tree, accepted since the canonical source is never itself excluded.
#
# plugins/context-kit/skills/*/scripts/smoke_test.py is this plugin's own persisted
# smoke-test convention (see .claude/rules -- the same shape as plugins/*/tests/**
# above, just outside a directory literally named tests/, so that exclusion's own glob
# doesn't reach it). Verified per-file before excluding (PR #353): every flagged
# subprocess.run() call across these files is the same safe, list-form shape already
# covered by the plugins/*/tests/** precedent above -- a hardcoded interpreter/script
# path (sys.executable, or a bash script resolved from this file's own directory) plus
# args controlled only by the test file's own functions, never external input (Bandit
# B404/B603/B607, plus a non-Bandit "subprocess without a static string" heuristic that
# fires on any list-form call containing a non-literal element, even a trusted
# pathlib.Path). The B101 ("assert" detected) finding is the same structural false
# positive as plugins/*/tests/** -- one assert, used as an import-time sanity check on
# a dynamically loaded module spec, not a runtime guard Python's -O flag could disable
# away. Same whole-path/whole-engine tradeoff as every entry above: this also silences
# secret-detection for this path, accepted for the same reason -- these are test
# fixtures with no real secrets, and a false-positive-plagued required check blocking
# every context-kit smoke-test edit is a worse practical outcome than losing this one
# narrow path's own secret-scan coverage.
exclude_paths:
  - "plugins/codex-kit/scripts/smoke-tests/**"
  - "plugins/*/tests/**"
  - ".github/scripts/test-issue-auto-labeling.js"
  - ".claude/skills/**"
  - ".claude/agents/**"
  - ".claude/commands/**"
  - ".claude/hooks/**"
  - ".claude/rules/**"
  - "plugins/context-kit/skills/*/scripts/smoke_test.py"
